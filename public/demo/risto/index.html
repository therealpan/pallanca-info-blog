<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="description" content="Diana, demo della sala in tempo reale per la ristorazione. Dati dimostrativi."><link rel="icon" href="/favicon.ico"></head><body>
<title>Diana Sala Viva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Marcellus&display=swap">
<style>
/* Layout: plastico a tutto schermo; barra in alto, numeri chiave in alto a sinistra, scheda di dettaglio a destra, percorso del tavolo in basso a sinistra, elenchi a schede in basso a destra */
:root{
  --bg:#EFE9DF; --card:#FFFEFB; --card-2:#F7F3EC; --line:#ECE5DA; --line-2:#E2D9CC;
  --ink:#1C1611; --ink-2:#48413B; --ink-3:#7A736C;
  --brass:#AF773A; --brass-ink:#8A5A26; --brass-soft:#F4E7D3;
  --sage:#3F6B4E; --sage-soft:#E1ECE2;
  --alert:#B03E2A; --alert-soft:#F8E1DA;
  --track:#EEE8DF;
  --shadow:0 1px 1px rgba(40,28,16,.04),0 10px 30px -12px rgba(60,40,20,.22);
  --f-display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --f-ui:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14110D; --card:#1F1A15; --card-2:#28211B; --line:#2F2821; --line-2:#3B332B;
  --ink:#F4EEE5; --ink-2:#D2C9BE; --ink-3:#A39A90;
  --brass:#D4A66B; --brass-ink:#E2BB86; --brass-soft:#3A2D1E;
  --sage:#9CC2A6; --sage-soft:#22302A;
  --alert:#EE8A72; --alert-soft:#41241D;
  --track:#2F2821;
  --shadow:0 1px 1px rgba(0,0,0,.25),0 12px 32px -14px rgba(0,0,0,.75);
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#14110D; --card:#1F1A15; --card-2:#28211B; --line:#2F2821; --line-2:#3B332B;
  --ink:#F4EEE5; --ink-2:#D2C9BE; --ink-3:#A39A90;
  --brass:#D4A66B; --brass-ink:#E2BB86; --brass-soft:#3A2D1E;
  --sage:#9CC2A6; --sage-soft:#22302A;
  --alert:#EE8A72; --alert-soft:#41241D;
  --track:#2F2821;
  --shadow:0 1px 1px rgba(0,0,0,.25),0 12px 32px -14px rgba(0,0,0,.75);
  color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.35;overflow:hidden}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums lining-nums}

.app{position:relative;height:100%;display:flex;flex-direction:column}
.top{position:relative;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;flex:none}
.logo svg{height:28px;width:auto}
.logo b{font:400 19px/1 var(--f-display);letter-spacing:.185em}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass-ink);background:var(--brass-soft);padding:4px 8px;border-radius:999px;white-space:nowrap}
.search{position:relative;flex:1 1 300px;max-width:440px;min-width:150px}
.search input{width:100%;border:1px solid var(--line-2);background:var(--card);border-radius:12px;padding:10px 40px 10px 38px;font-size:15px}
.search input::placeholder{color:var(--ink-3)}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-2)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:500 12px/1 var(--f-ui);border:1px solid var(--line-2);border-radius:5px;padding:3px 6px;color:var(--ink-3)}
.search .miss{position:absolute;top:calc(100% + 6px);left:0;font-size:13px;color:var(--alert);background:var(--card);padding:4px 8px;border-radius:8px;box-shadow:var(--shadow);white-space:nowrap}
.venue{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:12px;padding:6px 12px 6px 6px;min-width:0}
.venue .badge{font:700 12px/1 var(--f-ui);color:#fff;background:var(--brass);border-radius:8px;padding:9px 7px;letter-spacing:.04em}
.venue strong{display:block;font-weight:700;font-size:15px;white-space:nowrap}
.venue span{display:block;font-size:13px;color:var(--ink-3);white-space:nowrap}
.spacer{flex:1}
.live{display:flex;align-items:center;gap:8px;background:var(--brass-soft);color:var(--brass-ink);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--brass);display:block}
.live.on i{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);display:grid;place-items:center;position:relative;transition:transform .16s var(--ease),background-color .15s}
.iconbtn:active,.btn:active,.tab:active{transform:scale(.97)}
.iconbtn .dot{position:absolute;top:7px;right:8px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--alert);color:#fff;font:700 11px/16px var(--f-ui);text-align:center}
.user{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:4px 6px;border-radius:12px;text-align:left;position:relative}
.user .av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font:400 15px/1 var(--f-display);letter-spacing:.05em;flex:none}
.user strong{display:block;font-size:15px;white-space:nowrap}
.user span{display:block;font-size:13px;color:var(--ink-3);white-space:nowrap}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:220px;z-index:10}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:8px;text-align:left;font-size:15px}
.menu button small{color:var(--ink-3);font-size:12px;display:block}
.menu button[aria-checked="true"]{background:var(--card-2)}
@media (hover:hover) and (pointer:fine){.iconbtn:hover,.menu button:hover,.trow:hover,.btn:hover{background:var(--card-2)}.user:hover{background:var(--card-2)}}

.stage{position:relative;flex:1;min-height:0}
#scene{position:absolute;inset:0;touch-action:none}
#scene canvas{display:block}
#scene.drag{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.lbl{position:absolute;left:0;top:0;font:700 12px/1 var(--f-ui);color:var(--ink);background:var(--card);padding:4px 7px;border-radius:7px;white-space:nowrap;box-shadow:0 2px 6px -2px rgba(40,28,16,.3);transition:opacity .2s}
.lbl.sel{background:var(--ink);color:var(--card);padding:6px 9px;font-size:13px}
.lbl.sel small{display:block;font-weight:500;opacity:.8;font-size:12px;margin-top:3px}
.lbl.arr{background:var(--brass);color:#fff}
.lbl.hide{opacity:0}

.hud{position:absolute;inset:0;z-index:2;pointer-events:none;padding:18px;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr auto;gap:16px}
.hud>*{pointer-events:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* numeri chiave */
.kpis{grid-column:1/3;grid-row:1;display:flex;gap:12px;align-items:stretch;flex-wrap:wrap;align-self:start;pointer-events:none}
.kpis>*{pointer-events:auto}
.kpi{display:flex;gap:14px;align-items:center;padding:14px 18px 14px 14px;min-width:220px}
.icotile{width:48px;height:48px;border-radius:12px;background:var(--brass-soft);color:var(--brass-ink);display:grid;place-items:center;flex:none}
.icotile.alert{background:var(--alert-soft);color:var(--alert)}
.icotile.ink{background:var(--card-2);color:var(--ink-2)}
.kpi .lab{font-size:14px;color:var(--ink-2)}
.kpi .row{display:flex;align-items:baseline;gap:8px;margin:2px 0 1px}
.kpi .v{font:400 30px/1 var(--f-display)}
.kpi .v small{font:500 15px/1 var(--f-ui);color:var(--ink-3);margin-left:3px}
.kpi .tr{font-size:13px;font-weight:700;color:var(--sage);display:inline-flex;align-items:center;gap:2px}
.kpi .tr.down{color:var(--alert)}
.kpi .tr.flat{color:var(--ink-3)}
.kpi .sub{font-size:12.5px;color:var(--ink-3)}
.kpi.alert .v{color:var(--alert)}
.svc{display:grid;grid-template-columns:auto auto 1fr;gap:4px 14px;align-items:center;padding:12px 16px;min-width:340px;flex:1 1 360px;max-width:520px}
.svc .clock{font:400 30px/1 var(--f-display);letter-spacing:.02em}
.svc .lab{font-size:13px;color:var(--ink-3)}
.ctrls{display:flex;gap:8px;align-items:center;justify-self:end}
.play{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:var(--card);display:grid;place-items:center;transition:transform .16s var(--ease)}
.play:active{transform:scale(.95)}
.seg{display:inline-flex;background:var(--card-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(40,28,16,.14)}
.track{grid-column:1/-1;position:relative;height:40px;margin-top:4px}
.track svg{width:100%;height:30px;display:block}
.track input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.axis{grid-column:1/-1;display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:-8px}

/* controlli mappa */
.mapctl{grid-column:2;grid-row:2;justify-self:end;align-self:start;display:flex;flex-direction:column;padding:6px;gap:2px;margin-top:0}
.mapctl button{width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);transition:transform .16s var(--ease)}
.mapctl button:active{transform:scale(.94)}
.mapctl hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
@media (hover:hover) and (pointer:fine){.mapctl button:hover{background:var(--card-2);color:var(--ink)}}

/* dettaglio */
.detail{grid-column:3;grid-row:1/3;width:380px;align-self:start;max-height:100%;overflow:auto;padding:18px}
.dh{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding-bottom:14px;border-bottom:1px solid var(--line)}
.dh .eb{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brass-ink)}
.dh h2{font:400 22px/1.15 var(--f-display);margin:3px 0 2px;text-wrap:balance}
.dh p{margin:0;font-size:13.5px;color:var(--ink-3)}
.focusbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);display:grid;place-items:center;color:var(--ink-2)}
.focusbtn[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.status{display:flex;align-items:center;gap:10px;margin:14px 0 12px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:8px;white-space:nowrap;background:var(--card-2);color:var(--ink-2)}
.pill.ok{background:var(--sage-soft);color:var(--sage)}
.pill.warn{background:var(--brass-soft);color:var(--brass-ink)}
.pill.bad{background:var(--alert-soft);color:var(--alert)}
.pill.ink{background:var(--ink);color:var(--card)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card-2);border-radius:12px;padding:10px 12px}
.tile .tl{font-size:13px;color:var(--ink-3)}
.tile .tv{font-size:20px;font-weight:800;margin-top:2px}
.tile .tv small{font-size:14px;font-weight:500;color:var(--ink-3)}
.bar{height:5px;border-radius:99px;background:var(--track);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brass);transform-origin:left;transition:width .3s var(--ease)}
.bar.ok i{background:var(--sage)} .bar.bad i{background:var(--alert)} .bar.ink i{background:var(--ink-2)}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px;font-weight:700;font-size:15px}
.sect span{font-size:13px;color:var(--ink-3);font-weight:500}
.drow{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.drow:last-child{border-bottom:0}
.drow .nm{min-width:0}
.drow .nm b{display:block;font-weight:700}
.drow .nm small{display:block;color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .q{font-weight:700;font-variant-numeric:tabular-nums}
.drow .mini{width:70px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:13px;color:var(--ink-2)}
.legend div{display:flex;gap:8px;align-items:center}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink-2);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.switch button{width:40px;height:24px;border-radius:999px;border:0;background:var(--line-2);position:relative;flex:none;transition:background-color .2s}
.switch button::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.switch button[aria-checked="true"]{background:var(--sage)}
.switch button[aria-checked="true"]::after{transform:translateX(16px)}
.note{font-size:12.5px;color:var(--ink-3);margin:12px 0 0}

/* percorso del tavolo */
.journey{grid-column:1/3;grid-row:3;align-self:end;display:grid;grid-template-columns:1fr auto;gap:18px;padding:16px 18px;max-width:1000px}
.jh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.jh h3{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px}
.jh h3 svg{color:var(--brass)}
.jh span{font-size:13.5px;color:var(--ink-3);white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(6,1fr);position:relative}
.step{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;position:relative;z-index:1}
.step .c{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--line-2);color:var(--ink-3);transition:background-color .25s,border-color .25s,color .25s}
.step.done .c{background:var(--brass);border-color:var(--brass);color:#fff}
.step.now .c{background:var(--card);border-color:var(--brass);color:var(--brass);box-shadow:0 0 0 5px var(--brass-soft)}
.step.late .c{border-color:var(--alert);color:var(--alert);box-shadow:0 0 0 5px var(--alert-soft)}
.step b{font-size:13.5px;font-weight:700}
.step small{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.steps .line{position:absolute;top:20px;left:8.33%;right:8.33%;height:3px;background:var(--line-2);border-radius:3px}
.steps .line i{display:block;height:100%;background:var(--brass);border-radius:3px;transition:width .3s var(--ease)}
.jcard{background:var(--card-2);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;width:300px;align-self:center}
.jcard .ico{grid-row:1/4;width:52px;height:52px;border-radius:12px;background:var(--card);display:grid;place-items:center;color:var(--brass)}
.jcard b{font-size:15px;font-weight:800}
.jcard small{font-size:13px;color:var(--ink-3)}

/* elenchi a schede */
.lists{grid-column:3;grid-row:3;width:380px;align-self:end;padding:12px 14px;display:flex;flex-direction:column;max-height:300px;min-height:0}
.tabs{display:flex;gap:4px;background:var(--card-2);border-radius:10px;padding:3px;margin-bottom:8px}
.tab{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 6px;font-size:13.5px;font-weight:700;color:var(--ink-3);transition:transform .16s var(--ease)}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(40,28,16,.14)}
.tab span{color:var(--brass-ink);margin-left:3px}
.tbody{overflow:auto;min-height:0}
.trow{display:grid;grid-template-columns:54px 1fr auto 56px 12px;gap:8px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:8px 6px;border-radius:8px;border-bottom:1px solid var(--line)}
.trow[aria-current="true"]{background:var(--card-2)}
.trow b{display:block;font-size:14.5px;font-weight:800}
.trow small{display:block;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .loc{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.trow .loc i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink-2);margin-right:6px;vertical-align:1px}
.trow .fr{font-size:12px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.trow .fr .bar{margin:0 0 3px}
.trow svg.chev{color:var(--ink-3)}
.empty{padding:16px 8px;color:var(--ink-3);font-size:14px}
.nogl{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);text-align:center;padding:40px}

@media (max-width:1380px){ .venue{display:none} .kpi{min-width:0} .kpi .sub{display:none} .detail,.lists{width:340px} .jcard{display:none} }
@media (max-width:1180px){ .journey{display:none} .detail,.lists{width:320px} .icotile{width:40px;height:40px} .kpi{padding:12px 14px 12px 12px} .svc{min-width:300px} }
@media (max-width:1100px){ .user strong,.user span{display:none} .svc{min-width:0} .live{display:none} }
@media (max-width:900px){
  body{overflow:auto} .app{height:auto}
  .top{flex-wrap:wrap;gap:8px;padding:10px 16px} .search{order:5;flex-basis:100%;max-width:none}
  .stage{display:flex;flex-direction:column}
  #scene{position:relative;height:min(64vh,92vw);min-height:300px;order:2}
  .stage{padding:12px 16px 24px;gap:12px}
  .hud{display:contents}
  #scene{border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
  .kpis{order:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .kpi{flex-direction:column;align-items:flex-start;gap:4px;padding:10px 12px;min-width:0} .kpi .icotile{display:none} .kpi .lab{font-size:12.5px;line-height:1.2;min-height:30px} .kpi .tr{display:none} .kpi .v{font-size:26px}
  .svc{grid-column:1/-1;min-width:0;max-width:none}
  .top{gap:6px} .logo b{font-size:16px} .iconbtn{width:36px;height:36px} .user .av{width:34px;height:34px} .user>svg{display:none}
  .mapctl{order:3;flex-direction:row;align-self:center;margin:0}
  .mapctl hr{border-top:0;border-left:1px solid var(--line);margin:6px 4px}
  .detail,.lists{width:auto;max-height:none}
  .detail{order:4} .journey{order:5;grid-template-columns:1fr} .lists{order:6}
  .steps b{font-size:12px} .step .c{width:32px;height:32px} .steps .line{top:16px}
}
@media (max-width:480px){ .logo b{display:none} }
@media (prefers-reduced-motion:reduce){*{transition-duration:0s!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="logo"><svg viewBox="0 0 76.766 86" aria-hidden="true"><path d="M0 0h10.5v86H0z" fill="var(--ink)"/><path d="M18.5 0A45 45 0 1 1 18.5 86C32.47 79.12 51.77 66.65 51.77 43S32.47 6.88 18.5 0Z" fill="var(--ink)"/></svg><b>DIANA</b></div>
    <span class="tag">Dati dimostrativi</span>
    <div class="search">
      <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Cerca tavoli, ospiti, comande, addetti" aria-label="Cerca tavoli, ospiti, comande, addetti" autocomplete="off">
