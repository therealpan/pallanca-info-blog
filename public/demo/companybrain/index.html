/* Impianto: il mondo a rombo al centro, numeri e copione a sinistra, scheda ed elenco a destra, la giornata in basso. Un solo tema, notturno per scelta. */
:root{
  color-scheme:dark;
  --ink-0:#070c13; --ink-1:#0e1621; --ink-2:#162130; --ink-3:#213042;
  --line:rgba(176,198,226,.15); --line-2:rgba(176,198,226,.3);
  --fg:#e9eef5; --fg-2:#a9b6c7; --fg-3:#8492a5;
  --lume:#ffd28a;            /* luce di finestra: l'unico accento */
  --ok:#7be0b0; --wait:#ffa23f; --stop:#ff6b62; --mute:#9db2d6; --pub:#8fd8ff;   /* stati, non accento */
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Geist","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:.62rem; --r-s:.44rem; --pad:.85rem; --gap:.75rem; --edge:.75rem;
  --wl:19.5rem; --wr:21rem; --top:4.6rem; --hday:8.3rem; --hlist:18rem;
  --ease-out:cubic-bezier(.23,1,.32,1);
}
html{font-size:clamp(14px,.8334vw,40px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--ink-0);color:var(--fg);font:.85rem/1.45 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--lume);outline-offset:2px;border-radius:4px}
h1,h2,h3,p,dl,dd,ol,ul{margin:0}
[hidden]{display:none!important}

.app{position:relative;height:100%;overflow:hidden}
.stage{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 42%,#15233a 0%,#0b131f 52%,var(--ink-0) 100%)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas.is-drag{cursor:grabbing}
.stage canvas.is-hit{cursor:pointer}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* etichette dei luoghi */
.lbl{position:absolute;left:0;top:0;transform:translate(-9999px,0);white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:.12rem;text-align:center;will-change:transform}
.lbl b{font:600 .72rem/1.2 var(--f-body);letter-spacing:.01em;padding:.2rem .5rem;border-radius:99px;background:rgba(9,15,24,.8);border:1px solid var(--line);color:var(--fg)}
.lbl i{font:400 .62rem/1.2 var(--f-mono);font-style:normal;color:var(--fg-2);padding:.06rem .4rem;border-radius:99px;background:rgba(9,15,24,.7)}
.lbl em{font:500 .62rem/1.2 var(--f-mono);font-style:normal;padding:.12rem .4rem;border-radius:.25rem;background:rgba(9,15,24,.85);color:var(--fg-2);border:1px solid var(--line)}
.lbl em[data-tone="wait"]{color:var(--wait);border-color:rgba(255,162,63,.45)}
.lbl em[data-tone="stop"]{color:var(--stop);border-color:rgba(255,107,98,.45)}
.lbl em[data-tone="ok"]{color:var(--ok);border-color:rgba(123,224,176,.4)}
.lbl em:empty,.lbl i:empty{display:none}
.app[data-role="sponsor"] .lbl i,.app[data-role="steward"] .lbl i{display:none}
.lbl.is-on b{border-color:var(--lume);color:var(--lume)}
.lbl.is-lvl b{font:700 .78rem/1.2 var(--f-display);background:rgba(22,33,48,.92);border-color:var(--line-2);border-radius:.3rem}
.lbl.is-lvl i{display:none}
.tag{position:absolute;z-index:2;left:0;top:0;transform:translate(-9999px,0);white-space:nowrap;font:500 .7rem/1.25 var(--f-body);padding:.3rem .56rem;border-radius:var(--r-s);background:rgba(9,15,24,.94);border:1px solid var(--line-2);max-width:20rem;overflow:hidden;text-overflow:ellipsis}
.tag span{font-family:var(--f-mono);color:var(--fg-3);margin-right:.4rem}

/* superfici */
.panel{position:absolute;z-index:3;background:var(--ink-1);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1.1rem 2.5rem -1.1rem rgba(0,0,0,.7)}
.eyebrow{font:500 .66rem/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.rif{font:400 .64rem/1.4 var(--f-mono);color:var(--fg-3);margin-top:.7rem;overflow-wrap:anywhere}
.badge{font:500 .6rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--pub);border:1px dashed rgba(143,216,255,.5);border-radius:.25rem;padding:.12rem .3rem;vertical-align:.06rem;white-space:nowrap}

/* barra */
.bar{position:absolute;z-index:5;left:var(--edge);right:var(--edge);top:calc(var(--edge) + env(safe-area-inset-top,0px));height:3.1rem;display:flex;align-items:center;gap:var(--gap);padding:0 .62rem 0 .75rem;background:var(--ink-1);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1.1rem 2.5rem -1.1rem rgba(0,0,0,.7)}
.brand{display:flex;align-items:center;gap:.62rem;flex:none}
.brand svg{flex:none;width:1.9rem;height:1.9rem}
.brand h1{font:700 1.06rem/1.1 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.brand p{font:400 .69rem/1.3 var(--f-body);color:var(--fg-3);white-space:nowrap}
.demo .s{display:none}
.demo{flex:none;font:500 .62rem/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--lume);border:1px solid rgba(255,210,138,.45);padding:.26rem .44rem;border-radius:.3rem;white-space:nowrap}
.search{flex:1 1 11rem;min-width:7.5rem;max-width:21rem;position:relative}
.search input{width:100%;height:2.1rem;border-radius:var(--r-s);border:1px solid var(--line);background:var(--ink-0);padding:0 1.9rem 0 1.9rem;outline-offset:0}
.search input::placeholder{color:var(--fg-3)}
.search svg{position:absolute;left:.56rem;top:.62rem;width:.88rem;height:.88rem;pointer-events:none}
.search kbd{position:absolute;right:.44rem;top:.44rem;font:500 .62rem/1.2rem var(--f-mono);width:1.2rem;height:1.2rem;text-align:center;border:1px solid var(--line);border-radius:.25rem;color:var(--fg-3);pointer-events:none}
.grow{flex:1 1 0}
.seg{display:inline-flex;flex:none;border:1px solid var(--line);border-radius:var(--r-s);padding:.12rem;background:var(--ink-0);gap:.12rem}
.seg button{height:1.75rem;padding:0 .62rem;border-radius:.3rem;color:var(--fg-2);font-weight:500;white-space:nowrap;transition:background-color 160ms var(--ease-out),color 160ms var(--ease-out),transform 120ms var(--ease-out)}
.seg button:active{transform:scale(.97)}
.seg button[aria-pressed="true"]{background:var(--ink-3);color:var(--fg)}
#segRel button[aria-pressed="true"]{background:var(--lume);color:#2a1c00}
.relname{flex:none;font:400 .69rem/1.2 var(--f-body);color:var(--fg-2);white-space:nowrap;margin-left:-.3rem}
.ibtn{height:2rem;min-width:2rem;flex:none;padding:0 .56rem;border:1px solid var(--line);border-radius:var(--r-s);background:var(--ink-0);display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:500;white-space:nowrap;transition:background-color 160ms var(--ease-out),border-color 160ms var(--ease-out),transform 120ms var(--ease-out)}
.ibtn svg{width:.94rem;height:.94rem;flex:none}
.ibtn:active{transform:scale(.97)}
.ibtn[aria-pressed="true"]{border-color:var(--lume);color:var(--lume)}
.bell b{font:500 .72rem/1 var(--f-mono);font-variant-numeric:tabular-nums}
.bell[data-n="0"]{color:var(--fg-3)}
.bell:not([data-n="0"]){color:var(--wait);border-color:rgba(255,162,63,.5)}
.role{position:relative;flex:none}
.role .ibtn svg{width:.62rem;height:.62rem}
.menu{position:absolute;right:0;top:calc(100% + .4rem);width:17.5rem;padding:.3rem;background:var(--ink-1);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 1.4rem 2.6rem -1rem rgba(0,0,0,.8);display:grid;gap:.12rem;transform-origin:top right;transition:opacity 150ms var(--ease-out),transform 150ms var(--ease-out)}
@starting-style{.menu{opacity:0;transform:scale(.97)}}
.menu button{text-align:left;padding:.5rem .62rem;border-radius:var(--r-s);display:grid;gap:.06rem}
.menu button b{font-weight:600}
.menu button span{font-size:.72rem;color:var(--fg-3)}
.menu button[aria-checked="true"]{background:var(--ink-2)}
.menu button[aria-checked="true"] b{color:var(--lume)}
@media (hover:hover) and (pointer:fine){
  .seg button:hover{color:var(--fg)}
  #segRel button[aria-pressed="true"]:hover{color:#2a1c00}
  .ibtn:hover{background:var(--ink-2);border-color:var(--line-2)}
  .menu button:hover{background:var(--ink-2)}
}

/* numeri chiave */
.colL{position:absolute;z-index:3;left:var(--edge);top:calc(var(--top) + env(safe-area-inset-top,0px));width:var(--wl);display:flex;flex-direction:column;gap:var(--gap)}
.colL .panel{position:relative}
.kpi{padding:var(--pad)}
.kpi-main{display:grid;margin-top:.5rem}
.kpi-main>div{display:grid;grid-template-columns:2.3rem 1fr auto;column-gap:.7rem;align-items:center;padding:.62rem 0;border-bottom:1px solid var(--line)}
.kpi-main .ico{width:2.3rem;height:2.3rem;border-radius:.5rem;background:rgba(255,210,138,.1);color:var(--lume);display:grid;place-items:center}
.kpi-main .ico svg{width:1.15rem;height:1.15rem}
.kpi-main>div[data-tone="wait"] .ico{background:rgba(255,162,63,.13);color:var(--wait)}
.kpi-main>div[data-tone="stop"] .ico{background:rgba(255,107,98,.13);color:var(--stop)}
.kpi-main .txt{min-width:0;display:grid;gap:.1rem}
.kpi-main .txt b{font-weight:500;line-height:1.25}
.kpi-main .txt small{font-size:.7rem;color:var(--fg-3);line-height:1.25}
.kpi-main .num{text-align:right;display:grid;gap:.16rem;justify-items:end}
.kpi-main strong{font:700 1.9rem/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi-main>div[data-tone="wait"] strong{color:var(--wait)}
.kpi-main>div[data-tone="stop"] strong{color:var(--stop)}
.trend{font:500 .64rem/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg-3);white-space:nowrap;display:inline-flex;align-items:center;gap:.2rem}
.trend[data-d="up"]::before{content:"";border:.24rem solid transparent;border-bottom-color:currentColor;border-top:0}
.trend[data-d="down"]::before{content:"";border:.24rem solid transparent;border-top-color:currentColor;border-bottom:0}
.trend[data-v="good"]{color:var(--ok)} .trend[data-v="bad"]{color:var(--stop)}
.kpi-sub{margin-top:.75rem;display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.kpi-sub>div{display:flex;flex-direction:column;gap:.18rem;min-width:0}
.kpi-sub dt{font-size:.69rem;color:var(--fg-3);line-height:1.25;order:2}
.kpi-sub dd{font:500 1.1rem/1.1 var(--f-mono);font-variant-numeric:tabular-nums}

/* copione */
.script{padding:var(--pad) .5rem .5rem}
.script .eyebrow{padding:0 .35rem}
.script ol{margin-top:.5rem;padding:0;list-style:none;display:grid;gap:.12rem;counter-reset:m}
.script li{counter-increment:m}
.script li button{width:100%;display:grid;grid-template-columns:1.3rem 1fr auto;gap:.5rem;align-items:center;text-align:left;padding:.32rem .35rem;border-radius:var(--r-s);border:1px solid transparent;font-weight:500;transition:background-color 160ms var(--ease-out),transform 120ms var(--ease-out)}
.script li button::before{content:counter(m);font:500 .66rem/1.25rem var(--f-mono);width:1.25rem;height:1.25rem;border-radius:50%;border:1px solid var(--line-2);text-align:center;color:var(--fg-2)}
.script li button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.script li button code{font:400 .64rem/1 var(--f-mono);color:var(--fg-3)}
.script li button code.up{color:var(--lume)}
.script li button:active{transform:scale(.985)}
.script li button[aria-current="true"]{background:var(--ink-2);border-color:var(--line-2)}
.script li button[aria-current="true"]::before{background:var(--lume);border-color:var(--lume);color:#2a1c00}
@media (hover:hover) and (pointer:fine){.script li button:hover{background:var(--ink-2)}.btn:hover{background:var(--ink-3)}.btn.go:hover{background:#93ebc0}}

/* la giornata */
.day{left:var(--edge);right:calc(var(--edge) + var(--wr) + var(--gap));bottom:calc(var(--edge) + env(safe-area-inset-bottom,0px));height:var(--hday);padding:.62rem var(--pad) .5rem;display:flex;flex-direction:column;gap:.4rem}
.day-top{display:flex;align-items:center;gap:var(--gap);min-width:0}
.clock{font:700 1.75rem/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em;display:flex;align-items:baseline;gap:.6rem;flex:none}
.clock small{font:400 .62rem/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);white-space:nowrap}
.play{min-width:5.6rem}
.play svg{width:.75rem;height:.75rem}
.day-note{flex:1 1 0;min-width:0;text-align:right;font-size:.72rem;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;flex:1 1 auto;min-height:2.2rem;border-radius:var(--r-s);background:var(--ink-0);border:1px solid var(--line);cursor:ew-resize;touch-action:none;overflow:visible}
.bars{position:absolute;inset:.25rem .25rem .5rem;display:flex;align-items:flex-end;gap:1px}
.bars i{flex:1 1 0;background:#2a3a50;border-radius:1px 1px 0 0;min-height:1px}
.bars i.past{background:#6f5f45}
.pres{position:absolute;left:.25rem;right:.25rem;bottom:.2rem;height:.16rem}
.pres i{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.55;border-radius:1px}
.ticks{position:absolute;inset:0 .25rem}
.ticks button{position:absolute;top:-.5rem;width:1.15rem;height:1.15rem;margin-left:-.575rem;border-radius:50%;background:var(--ink-2);border:1px solid var(--line-2);font:500 .6rem/1.05rem var(--f-mono);color:var(--fg-2);text-align:center;transition:transform 120ms var(--ease-out)}
.ticks button.up{border-style:dashed;color:var(--fg-3)}
.ticks button[aria-current="true"]{background:var(--lume);border-color:var(--lume);color:#2a1c00}
.ticks button:active{transform:scale(.94)}
.ticks .mark{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed rgba(255,162,63,.5);pointer-events:none}
.cursor{position:absolute;top:-.2rem;bottom:-.2rem;left:.25rem;width:2px;margin-left:-1px;background:var(--lume);border-radius:1px;pointer-events:none;will-change:transform}
.cursor::after{content:"";position:absolute;left:-.25rem;bottom:-.3rem;border:.3rem solid transparent;border-bottom-color:var(--lume);border-top:0}
.hours{display:flex;justify-content:space-between;padding:0 .25rem;font:400 .6rem/1 var(--f-mono);color:var(--fg-3)}
.hours span{width:0;display:flex;justify-content:center}
.hours span:nth-child(1){margin-left:0}
.hours{margin-right:9.09%}

/* scheda */
.detail{right:var(--edge);top:calc(var(--top) + env(safe-area-inset-top,0px));width:var(--wr);max-height:calc(100% - var(--top) - var(--hlist) - var(--edge) - var(--gap));overflow:auto;padding:var(--pad);scrollbar-width:thin}
.d-head{display:grid;grid-template-columns:2.3rem 1fr;gap:.7rem;align-items:start}
.d-head .ico{width:2.3rem;height:2.3rem;border-radius:.5rem;background:rgba(255,210,138,.1);color:var(--lume);display:grid;place-items:center}
.d-head .ico .g{width:1rem;height:1rem}
.d-head .ico svg{width:1.15rem;height:1.15rem}
.detail h2{font:700 1.02rem/1.22 var(--f-display);letter-spacing:-.005em;margin-top:.2rem;text-wrap:balance}
.detail .lead{color:var(--fg-2);margin-top:.6rem;max-width:44ch}
.pill{display:inline-flex;align-items:center;gap:.4rem;margin-top:.7rem;padding:.26rem .56rem .26rem .44rem;border-radius:99px;border:1px solid var(--line-2);font-weight:500;line-height:1.25;max-width:100%}
.pill .g{width:.69rem;height:.69rem}
.pill code{font:400 .66rem/1 var(--f-mono);color:var(--fg-3);margin-left:.2rem}
.pill.t-wait{border-color:rgba(255,162,63,.5)} .pill.t-stop{border-color:rgba(255,107,98,.5)} .pill.t-ok{border-color:rgba(123,224,176,.45)}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:.75rem;background:var(--line);border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.quad>div{background:var(--ink-1);padding:.5rem .62rem;display:grid;gap:.16rem;min-width:0}
.quad dt{font-size:.69rem;color:var(--fg-3);line-height:1.2}
.quad dd{font-weight:500;line-height:1.25;overflow-wrap:anywhere}
.quad dd.n{font:500 1.15rem/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.facts{margin-top:.75rem;display:grid;grid-template-columns:auto 1fr;gap:.4rem .75rem}
.facts dt{color:var(--fg-3);font-size:.75rem}
.facts dd{min-width:0;overflow-wrap:anywhere}
.steps{list-style:none;padding:0;margin-top:.5rem;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:2.6rem .9rem 1fr;gap:.4rem;align-items:start;padding:.18rem 0;position:relative;font-size:.78rem;line-height:1.3;color:var(--fg-2)}
.steps li time{font:400 .66rem/1.3 var(--f-mono);color:var(--fg-3);font-variant-numeric:tabular-nums;padding-top:.06rem}
.steps li::before{content:"";grid-column:2;grid-row:1;width:.5rem;height:.5rem;border-radius:50%;background:var(--fg-3);margin:.26rem auto 0}
.steps li:not(:last-child)::after{content:"";position:absolute;left:3.44rem;top:.9rem;bottom:-.3rem;width:1px;background:var(--line-2)}
.steps li span{grid-column:3}
.steps li.now{color:var(--fg);font-weight:500}
.steps li.now::before{background:var(--lume);box-shadow:0 0 0 .18rem rgba(255,210,138,.2)}
.steps li.now.t-wait::before{background:var(--wait);box-shadow:0 0 0 .18rem rgba(255,162,63,.2)}
.steps li.t-stop::before{background:var(--stop)} .steps li.t-ok::before{background:var(--ok)}
.acts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
.btn{height:2rem;padding:0 .75rem;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--ink-2);font-weight:500;transition:background-color 160ms var(--ease-out),transform 120ms var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn.go{background:var(--ok);border-color:var(--ok);color:#06241a}
.btn.no{border-color:rgba(255,107,98,.6);color:var(--stop)}
.btn[aria-pressed="true"]{border-color:var(--lume);color:var(--lume)}
.sub{margin-top:.8rem;padding-top:.7rem;border-top:1px solid var(--line)}
.note{margin-top:.6rem;font-size:.75rem;color:var(--fg-3)}
.note.you{color:var(--lume)}
.legend{padding:0;list-style:none;display:grid;gap:.44rem;align-content:start}
.leg2{display:grid;grid-template-columns:1fr 1fr;gap:.4rem .75rem;margin-top:.7rem}
.legend li{display:grid;grid-template-columns:1rem 1fr;align-items:center;gap:.5rem;font-size:.78rem;line-height:1.25}

/* glifi di forma e stato */
.g{width:.88rem;height:.88rem;display:inline-block;flex:none;justify-self:center;position:relative;color:var(--fg-2)}
.g[data-g="sfera"]{border-radius:50%;background:currentColor}
.g[data-g="diamante"]{background:currentColor;transform:rotate(45deg) scale(.78)}
.g[data-g="foglio"]{background:currentColor;height:.62em;margin-top:.12em;border-radius:1px;transform:skewX(-14deg)}
.g[data-g="cubo"]{background:currentColor;border-radius:2px;transform:scale(.82)}
.g[data-g="cuneo"]{background:currentColor;clip-path:polygon(50% 6%,100% 94%,0 94%)}
.g[data-g="sigillo"]{background:currentColor;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.g[data-g="coppia"]{background:radial-gradient(circle at 26% 50%,currentColor 0 24%,transparent 26%),radial-gradient(circle at 74% 50%,var(--mute) 0 24%,transparent 26%)}
.g[data-g="anello"]{border:.16em solid currentColor;border-radius:50%}
.g[data-g="doppio"]{border:.13em solid currentColor;border-radius:50%}
.g[data-g="doppio"]::after{content:"";position:absolute;inset:.16em;border-radius:50%;background:currentColor}
.g[data-g="stop"]{background:currentColor;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.g[data-g="citata"]{border-radius:50%;background:currentColor}
.g[data-g="citata"]::after{content:"";position:absolute;right:-.25em;top:-.25em;width:.44em;height:.56em;background:var(--fg);border-radius:1px}
.t-go{color:var(--lume)} .t-ok{color:var(--ok)} .t-wait{color:var(--wait)} .t-stop{color:var(--stop)} .t-mute{color:var(--mute)} .t-off{color:var(--fg-3)}
.chip{display:inline-flex;align-items:center;gap:.4rem;line-height:1.25;min-width:0}
.chip .g{width:.69rem;height:.69rem}

/* didascalia del copione */
.caption{position:absolute;z-index:4;left:calc(var(--edge) + var(--wl) + var(--gap));right:calc(var(--edge) + var(--wr) + var(--gap));bottom:calc(var(--edge) + var(--hday) + var(--gap) + env(safe-area-inset-bottom,0px));max-width:36rem;margin-inline:auto;padding:.7rem .88rem;background:rgba(9,15,24,.96);border:1px solid var(--line-2);border-radius:var(--r);display:grid;grid-template-columns:1fr auto;gap:.25rem .75rem;transition:opacity 220ms var(--ease-out),transform 220ms var(--ease-out)}
.caption h3{font:700 .92rem/1.2 var(--f-display)}
.caption p{grid-column:1;color:var(--fg-2);max-width:62ch;font-size:.8rem}
.caption button{grid-row:1/3;grid-column:2;align-self:start}
@starting-style{.caption{opacity:0;transform:translateY(.4rem)}}

/* elenco */
.list{right:var(--edge);bottom:calc(var(--edge) + env(safe-area-inset-bottom,0px));width:var(--wr);height:var(--hlist);display:flex;flex-direction:column;padding:.56rem 0 0}
.list header{padding:0 .56rem .5rem;display:flex}
.tabs{width:100%}
.tabs button{flex:1 1 0;padding:0 .3rem;font-size:.75rem;display:inline-flex;align-items:center;justify-content:center;gap:.3rem;min-width:0}
.tabs button b{font:500 .64rem/1 var(--f-mono);color:var(--fg-3);font-variant-numeric:tabular-nums}
.tabs button[aria-pressed="true"] b{color:var(--lume)}
.rows{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line);padding:.25rem;scrollbar-width:thin}
.row{width:100%;display:grid;grid-template-columns:3.3rem 1fr .6rem;gap:.06rem .5rem;text-align:left;padding:.36rem .5rem;border-radius:var(--r-s);border:1px solid transparent;align-items:center}
.row code{font:400 .66rem/1.5 var(--f-mono);color:var(--fg-3);grid-row:1/3;align-self:start}
.row b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .chip{font-size:.72rem;color:var(--fg-2);grid-column:2}

<script>
(function(){'use strict';
const RIF_ON=false;
/* ================= 1. MONDO: luoghi, percorsi, cataloghi. Nessuna grafica. ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash32(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const fmt=n=>Number(n).toLocaleString('en-US');
const T0=8*60, DAY=660;                       // la giornata: dalle 08:00 alle 19:00, in minuti
const pad2=n=>String(Math.floor(n)).padStart(2,'0');
const hhmm=t=>{const m=Math.floor(T0+t+1e-6);return pad2(m/60)+':'+pad2(m%60);};
const tOf=(h,m)=>h*60+m-T0;
const SCENE=['sede','fil'];

function grafo(){
  const N={},ADJ={},ROADS=[],RC=new Map();
  return{N,ADJ,ROADS,
    nd(id,x,z,y){N[id]={id,x,z,y:y||0};ADJ[id]=[];},
    ln(kind,...ids){for(let i=1;i<ids.length;i++){ADJ[ids[i-1]].push(ids[i]);ADJ[ids[i]].push(ids[i-1]);ROADS.push([ids[i-1],ids[i],kind]);}},
    route(a,b){
      const k=a+'>'+b;if(RC.has(k))return RC.get(k);
      const dist={},prev={},Q=new Set(Object.keys(N));for(const id of Q)dist[id]=Infinity;dist[a]=0;
      while(Q.size){let u=null,m=Infinity;for(const id of Q)if(dist[id]<m){m=dist[id];u=id;}
        if(u===null||u===b)break;Q.delete(u);
        for(const v of ADJ[u]){const d=m+Math.hypot(N[u].x-N[v].x,N[u].y-N[v].y,N[u].z-N[v].z);if(d<dist[v]){dist[v]=d;prev[v]=u;}}}
      const ids=[b];let c=b,g=0;while(c!==a&&g++<199){c=prev[c];if(c===undefined)break;ids.unshift(c);}
      const out={ids,len:dist[b]};RC.set(k,out);return out;}};
}

/* ---------- scena 1: la sede. Il Company Brain al centro, i reparti a ovest, i sistemi a est ---------- */
const G1=grafo();
(function(){const g=G1,n=g.nd,l=g.ln;
  n('dIT',-17.2,10);n('wS',-15.6,10);n('w0',-15.6,0);n('wN',-15.6,-5);n('dVen',-17.2,-5);n('wNN',-15.6,-13);
  l('vialetto','dIT','wS');l('vialetto','dVen','wN');l('strada','wS','w0','wN','wNN');
  n('aW',-9.5,0);n('rW',-4.6,0);n('rNW',-3.25,-3.25);n('rN',0,-4.6);n('rNE',3.25,-3.25);n('rE',4.6,0);n('rSE',3.25,3.25);n('rS',0,4.6);n('rSW',-3.25,3.25);
  l('strada','w0','aW','rW');l('anello','rW','rNW','rN','rNE','rE','rSE','rS','rSW','rW');
  const fx=[-12,-4,4,12];fx.forEach((x,i)=>{n('dF'+i,x,-15.6);n('s'+i,x,-13);l('vialetto','dF'+i,'s'+i);});
  n('sC',0,-13);n('ing',0,-9.2);l('strada','wNN','s0','s1','sC','s2','s3');l('strada','sC','ing','rN');
  n('e1',8,0);n('e2',9.4,0);n('c0',16,0);n('cE',21,0);n('gw',24,0);n('g1',26.5,0);l('strada','rE','e1','e2','c0','cE','gw','g1');
  n('mD',8,-4.6);l('vialetto','e1','mD');
  n('oD',9.4,3.8);l('vialetto','e2','oD');
  n('cD',16,-1.7);l('vialetto','c0','cD');n('ib',16,2.4);l('vialetto','c0','ib');
  n('mzD',21,-9.6);l('strada','cE','mzD');
  [-9,-3,3,9].forEach((z,i)=>n('y'+i,26.5,z));l('strada','y0','y1','g1','y2','y3');
  n('st',-8,10);n('sS',0,10);n('dv',0,12.2);l('strada','wS','st','sS');l('strada','rS','sS');l('vialetto','sS','dv');
  n('ingr',26.5,17.5);l('strada','y3','ingr');
})();
const RING=['rE','rSE','rS'];   // il brain riceve sul lato rivolto alla camera
const FONTI=['f_docs','f_chat','f_ticket','f_crm'], SISTEMI=['s_docs','s_ticket','s_crm','s_mail'];
const S1={
  fx:[-12,-4,4,12], sz:[-9,-3,3,9],
  pad:i=>({x:13.2+(i%5)*1.4,z:4.6+Math.floor(i/5)*1.8}),
  stew:i=>({x:-11+i,z:8.5}),
  div:i=>{const a=Math.PI*(1.15+i*0.14);return{x:Math.cos(a)*2.1,z:15.4+Math.sin(a)*2.1};},
  bench:i=>({x:9.4,z:5.5+i*1.3}),
  mloc:i=>({x:4.2+i*0.85,z:-7.9}), mapi:i=>({x:9.6+i*0.8,z:-7.9})
};

/* ---------- scena 2: la filiera. Sei terrazze che salgono, L7 in cima ---------- */
const G2=grafo();
const RISE=1.0, Y7=6*RISE, zc=i=>26-(i-1)*10, yL=i=>(i-1)*RISE;
const yFil=z=>{const i=Math.max(1,Math.min(7,Math.round((26-z)/10)+1));return (z<-29.2?6:i-1)*RISE;};
(function(){const g=G2,n=g.nd,l=g.ln;
  for(let i=1;i<=6;i++){const z=zc(i),y=yL(i);n('c'+i+'s',0,z+4.3,y);n('c'+i,0,z,y);n('c'+i+'n',0,z-4.3,y);n('p'+i,-3.4,z,y);n('q'+i,3,z,y);
    l('viale','c'+i+'s','c'+i,'c'+i+'n');l('vialetto','p'+i,'c'+i,'q'+i);if(i>1)l('scala','c'+(i-1)+'n','c'+i+'s');}
  n('c7',0,-31,Y7);l('scala','c6n','c7');
  n('b4',9.4,-4,yL(4));l('vialetto','q4','b4');
  n('gwF',6.2,-25.1,yL(6));l('vialetto','q6','gwF');
})();
const S2={
  pad:i=>({x:3.4+(i%5)*1.4,z:-22.0-Math.floor(i/5)*1.6}),
  stew:i=>({x:3.8+(i%4)*1.4,z:-2.9-Math.floor(i/4)*1.7}),
  div:i=>{const a=Math.PI*(0.62+i*0.152);return{x:7+Math.cos(a)*1.9,z:6+Math.sin(a)*1.9};},
  bench:i=>({x:-4.6,z:-12.2-i*1.2}),
  mloc:i=>({x:5.0+i*0.8,z:15.0}), mapi:i=>({x:8.6+i*0.7,z:15.0}),
  fonte:k=>({x:-8,z:23+k*2}), sis:k=>({x:3.6+k*2.2,z:-27.3})
};

/* ancora: da un nome di luogo a nodo del grafo, punti finali e posizione di arrivo, per ciascuna scena */
function ancora(sc,nome,e,slot,from){
  const n=e.n||0,j3=(n%3)-1,P=(node,pts)=>({node,tail:pts||[]});
  let k=-1,base=nome;const ci=nome.indexOf(':');if(ci>0){base=nome.slice(0,ci);const id=nome.slice(ci+1);k=base==='sis'?SISTEMI.indexOf(id):FONTI.indexOf(id);}
  let A;
  if(sc==='sede'){
    switch(base){
      case'origine':A=e.base.rep==='ven'?P('dVen',[{x:-17.9,z:-5+((n%5)-2)*0.5}]):P('dIT',[{x:-17.9,z:10+((n%5)-2)*0.5}]);break;
      case'brain':case'permessi':{let best=RING[0];if(from&&RING.indexOf(from)>=0)best=from;else if(from){let m=Infinity;for(const r of RING){const d=G1.route(from,r).len;if(d<m){m=d;best=r;}}}
        const b=G1.N[best],a=Math.atan2(b.z,b.x)+((n%5)-2)*0.13;A=P(best,[{x:Math.cos(a)*3.3,z:Math.sin(a)*3.3}]);break;}
      case'modelli':case'classe':A=P('mD',[{x:8+j3*0.7,z:-5.4}]);break;
      case'm_loc':A=P('mD',[S1.mloc(slot||0)]);break;
      case'm_api':A=P('mD',[S1.mapi(slot||0)]);break;
      case'officina':case'controlli':A=P('oD',[S1.bench(slot||0)]);break;
      case'controllo':A=P('cD',[{x:15.2+(n%3)*0.8,z:-2.3}]);break;
      case'pad':A=P('ib',[S1.pad(slot||0)]);break;
      case'gateway':A=P('gw',[{x:24,z:j3*0.45}]);break;
      case'sis':A=P('y'+k,[{x:27.4,z:S1.sz[k]+1.8},{x:29.1+j3*0.45,z:S1.sz[k]+1.8}]);break;
      case'steward_pad':A=P('st',[S1.stew(slot||0)]);break;
      case'div_pad':A=P('dv',[S1.div(slot||0)]);break;
      case'fonte':case'allow':A=P('dF'+k,[{x:S1.fx[k]+j3*0.6,z:-16.0}]);break;
      case'ingest':A=P('ing',[{x:((n%4)-1.5)*0.6,z:-9.2}]);break;
      case'misura':A=P('mzD',[{x:21+j3*0.5,z:-10.0}]);break;
      default:throw new Error('ancora sconosciuta: '+nome);}
    for(const p of A.tail)p.y=0;
    const nd=G1.N[A.node],last=A.tail.length?A.tail[A.tail.length-1]:nd;A.end={x:last.x,y:0,z:last.z};return A;
  }
  switch(base){
    case'origine':A=P('b4',[{x:12.4,z:-4},{x:12.4,z:(e.base.rep==='ven'?-5.8:-2.2)+((n%5)-2)*0.22}]);break;
    case'brain':{const a=((n%7)-3)*0.2;A=P('p4',[{x:-7+Math.cos(a)*3.2,z:-4+Math.sin(a)*3.2}]);break;}
    case'permessi':A=P('c2n',[{x:j3*0.6,z:12.5}]);break;
    case'modelli':case'classe':A=P('q2',[{x:3.7,z:16+j3*0.7}]);break;
    case'm_loc':A=P('q2',[S2.mloc(slot||0)]);break;
    case'm_api':A=P('q2',[S2.mapi(slot||0)]);break;
    case'officina':A=P('p5',[S2.bench(slot||0)]);break;
    case'controlli':A=P('c5n',[{x:j3*0.6,z:-17.5}]);break;
    case'controllo':A=P('p6',[{x:-5.0,z:-23.2-(n%3)*0.8}]);break;
    case'pad':A=P('q6',[S2.pad(slot||0)]);break;
    case'gateway':A=P('gwF',[{x:6.2+j3*0.4,z:-25.1}]);break;
    case'sis':A=P('gwF',[{x:S2.sis(k).x,z:-26.2}]);break;
    case'steward_pad':A=P('q4',[S2.stew(slot||0)]);break;
    case'div_pad':A=P('q3',[S2.div(slot||0)]);break;
    case'fonte':A=P('p1',[{x:-5.3,z:S2.fonte(k).z+j3*0.3}]);break;
    case'allow':A=P('c1n',[{x:j3*0.6,z:22.5}]);break;
    case'ingest':A=P('p2',[{x:-4.8,z:16+((n%4)-1.5)*0.6}]);break;
    case'misura':A=P('c7',[{x:j3*0.5,z:-31}]);break;
    default:throw new Error('ancora sconosciuta: '+nome);}
  for(const p of A.tail)p.y=yFil(p.z);
  const last=A.tail[A.tail.length-1];A.end={x:last.x,y:last.y,z:last.z};return A;
}
const GRAFI={sede:G1,fil:G2};

/* ---------- luoghi: stessi nomi nelle due scene, coordinate diverse ---------- */
const PL={
  rep_it:{nome:'Reparto IT',tech:'Reparto pilota',da:1,

    out.x=a.x+(b.x-a.x)*k;out.y=a.y+(b.y-a.y)*k;out.z=a.z+(b.z-a.z)*k;out.dx=b.x-a.x;out.dz=b.z-a.z;out.u=u;out.mv=true;return out;}

function simula(rel,ov){
  ov=ov||new Map();

  const push=(t,fn,e,arg)=>{const it={t,k:seq++,fn,e,arg};heap.push(it);let i=heap.length-1;while(i>0){const p=(i-1)>>1;if(heap[p].t<it.t||(heap[p].t===it.t&&heap[p].k<it.k))break;heap[i]=heap[p];i=p;}heap[i]=it;};

      if(dist3(prev.p[sc],A.end)<0.06){if(still)s.m[sc]=prev.m[sc];s.p[sc]=prev.p[sc];continue;}
      const from=posSeg(prev,now,sc,{}),pts=[{x:from.x,y:from.y,z:from.z}];

      if(e.nodo[sc]!==A.node||still)G.route(e.nodo[sc],A.node).ids.forEach(id=>add(G.N[id]));
      A.tail.forEach(add);
      const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+dist3(pts[i],pts[i-1]));
      const len=cum[cum.length-1];if(len<0.03){s.p[sc]=A.end;continue;}
      s.m[sc]={pts,cum,len,t0:now,dur:0.3};s.p[sc]=A.end;e.nodo[sc]=A.node;

function pickAt(px,py){
  let best=null,bd=1e9;
  for(const e of W.live||[]){if(e._sx===undefined)continue;const d=Math.hypot(e._sx-px,e._sy+6-py);if(d<24&&d<bd){bd=d;best=e;}}

  return hit.length?{t:'p',id:hit[0].object.userData.place}:null;
}

  for(const m of W.muri){const tg=m.nx*cx+m.nz*cz>.15?m.low:1;if(Math.abs(tg-m.k)>.002){m.k+=(tg-m.k)*k;m.g.scale.y=m.k;W.dirty=true;}else if(m.k!==tg){m.k=tg;m.g.scale.y=tg;W.dirty=true;}}}

}

function fotografia(t){
  const sn={t,st:{},fermo:{},exec:{},gen:{loc:0,api:0},liv:[],items:[],attesa:0,propAttesa:0,divAperte:0,revProp:0,connKo:0,T:{T1:0,T2:0,T3:0}};
  for(let i=0;i<=7;i++)sn.liv.push({stop:0,wait:0,work:0,stopFermo:0});
  const q={};
  for(const e of TL.vivi(t)){const s=segAt(e,t),st=s.st,tone=STATI[st][1],L=sn.liv[STATI[st][2]];
    sn.st[st]=(sn.st[st]||0)+1;if(!posSeg(s,t,'sede',q).mv)sn.fermo[st]=(sn.fermo[st]||0)+1;
    if(tone==='stop'){L.stop++;if(!posSeg(s,t,'fil',q).mv)L.stopFermo++;}else if(tone==='wait')L.wait++;else L.work++;
    if(st==='c_esegue')sn.exec[e.base.sis]=(sn.exec[e.base.sis]||0)+1;
    if(st==='d_genera'){const a=attrAt(e,t);if(a.modello)sn.gen[a.modello]++;}
    if(tone==='wait'){if(e.kind==='compito'){sn.attesa++;sn.T[e.base.liv]=(sn.T[e.base.liv]||0)+1;}else if(e.kind==='proposta')sn.propAttesa++;else if(e.kind==='divergenza')sn.divAperte++;else if(e.kind==='revoca')sn.revProp++;}
    sn.items.push({e,s,st,tone});}
  for(const f of FONTI)if(PL[f].da<=S.rel&&TL.conn(f,t).v!=='ok')sn.connKo++;

      +'<div class="sub"><div class="eyebrow">Percorso</div><ol class="steps">'+stHtml+'</ol></div>'+rifHtml(RIF[e.kind])
      +'<div class="acts">'+(attesa?'<button class="btn go" data-act="ok">'+lab+'</button>'+((a.firme||0)===0?'<button class="btn no" data-act="no">Rifiuta</button>':''):'')
      +(prop?'<button class="btn go" data-act="ok">Approva</button><button class="btn no" data-act="no">Rifiuta</button>':'')
      +(vivo?'<button class="btn" data-act="segui" aria-pressed="'+(S.follow?'true':'false')+'">Segui</button>':'')+chiudi+'</div>'
      +(attesa&&e.base.manuale?'<p class="note you">Questa azione aspetta te: in questa demo l’approvatore sei tu.</p>':'')+((attesa||prop)&&!e.base.manuale?'<p class="note">Puoi decidere tu al posto della postazione di ruolo: cambia solo il futuro della giornata.</p>':'')};
}
let detKey='';
function renderDetail(sn){const d=scheda(sn),box=$('#detail');if(d.key!==detKey){detKey=d.key;box.innerHTML=d.html;box.scrollTop=0;}
  for(const el of $$('[data-k]',box)){const v=d.vals[el.dataset.k];if(v!==undefined)setText(el,v);}}

let SN=null;
function renderAll(){SN=fotografia(S.t);renderKpi(SN);renderDay(SN);renderList(SN);renderDetail(SN);const al=segnalazioni(SN),b=$('#bell');setText($('#bellN'),al.length);if(b.dataset.n!==String(al.length))b.dataset.n=al.length;
  if(W.ok){paintWindows();syncPlaces(SN);}}
subs.push(renderAll);

/* ================= 8. COMANDI ================= */
function seleziona(sel){S.sel=sel;if(!sel||sel.t!=='e')S.follow=false;emit('sel');}
function pausa(v){S.paused=v===undefined?!S.paused:v;if(!S.paused&&S.fine){S.fine=false;S.t=0;for(const r in OV){OV[r].clear();delete CACHE[r];}carica(S.rel);}   // Ricomincia: la giornata riparte senza le decisioni del giro prima
 const b=$('#pause');b.setAttribute('aria-pressed',S.paused?'true':'false');setText($('#pauseTxt'),S.fine?'Ricomincia':S.paused?'Riprendi':'Pausa');
  $('#pauseIco').innerHTML=S.paused?'<path d="M2.5 1.2v9.6L10.5 6z"/>':'<rect x="1.5" y="1" width="3.2" height="10" rx=".8"/><rect x="7.3" y="1" width="3.2" height="10" rx=".8"/>';W.dirty=true;}
function velocita(n){S.speed=n;$$('[data-speed]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.speed===n?'true':'false'));}
function vaiA(t){S.t=Math.max(0,Math.min(DAY,t));if(S.t<DAY&&S.fine){S.fine=false;pausa(S.paused);}W.dirty=true;emit('salto');}
function setRel(r){if(r===S.rel)return;S.rel=r;carica(r);$$('[data-rel]',$('#segRel')).forEach(b=>b.setAttribute('aria-pressed',+b.dataset.rel===r?'true':'false'));setText($('#relName'),REL_NOME[r]);
  if(S.sel&&S.sel.t==='e'&&!TL.byId.has(S.sel.id))S.sel=null;litSig='';if(W.ok)for(const y of W.tally[S.scene])y.n=-1;emit('rel');W.dirty=true;}
function setRole(r){S.role=r;S.tab=0;app.dataset.role=r;setText($('#roleName'),RUOLI[r].nome);$('#roleMenu').hidden=true;$('#roleBtn').setAttribute('aria-expanded','false');
  $$('#roleMenu button').forEach(b=>b.setAttribute('aria-checked',b.dataset.role===r?'true':'false'));const f=RUOLI[r].fuoco;if(W.ok){if(f){const q=f[S.scene];cam.g.zoom=cam.fit*q[2];cam.g.tx=q[0];cam.g.tz=q[1];}else home();}emit('ruolo');W.dirty=true;}
function setScene(sc){if(sc===S.scene)return;S.scene=sc;app.dataset.scene=sc;$$('[data-scene]',$('#segScene')).forEach(b=>b.setAttribute('aria-pressed',b.dataset.scene===sc?'true':'false'));
  if(S.sel&&S.sel.t==='p'&&!POS[sc][S.sel.id]&&!(sc==='fil'&&/^L\d$/.test(S.sel.id)))S.sel=null;S.hover=null;if(W.ok)mostraScena();emit('scena');W.dirty=true;}
function ruota(d){cam.g.az+=d*Math.PI/2;W.dirty=true;}
function inquadra(sel){if(!W.ok||!sel)return;const sc=S.scene;
  if(sel.t==='p'){if(/^L\d$/.test(sel.id)){const i=+sel.id.charAt(1);camTo(0,i<7?zc(i):-33,1.9);}else{const q=POS[sc][sel.id];if(q)camTo(q[0],q[1],1.8);}}
  else{const e=TL.byId.get(sel.id);if(e&&S.t>=e.born){const p=posSeg(segAt(e,S.t),S.t,sc,{});camTo(p.x,p.z,1.6);}}}
function decidiTu(dec){const e=S.sel&&S.sel.t==='e'?TL.byId.get(S.sel.id):null;if(!e)return;const l=OV[S.rel].get(e.id)||[];l.push({t:S.t,dec});OV[S.rel].set(e.id,l);CACHE[S.rel]=null;carica(S.rel);if(W.ok)for(const y of W.tally[S.scene])y.n=-1;emit('decisione');W.dirty=true;}

/* copione: sette momenti fissi della giornata */
function momento(i){const m=MOMENTI[i];if(m.da>S.rel)setRel(m.da);S.fine=false;S.t=m.t+.15;S.copione=i;if(S.paused)pausa(false);velocita(1);S.sel={t:'e',id:m.sel};S.follow=true;
  if(W.ok){cam.g.zoom=cam.fit*(S.scene==='sede'?1.75:1.9);const e=TL.byId.get(m.sel),p=posSeg(segAt(e,S.t),S.t,S.scene,{});cam.g.tx=p.x;cam.g.tz=p.z;}
  setText($('#capT'),m.titolo);setText($('#capP'),m.p);$('#caption').hidden=false;$$('#script button').forEach((b,j)=>b.setAttribute('aria-current',j===i?'true':'false'));emit('copione');W.dirty=true;}
function chiudiCopione(){$('#caption').hidden=true;S.copione=null;$$('#script button').forEach(b=>b.setAttribute('aria-current','false'));emit('copione');}
$('#script').innerHTML=MOMENTI.map((m,i)=>'<li><button data-m="'+i+'" aria-current="false"><span>'+esc(m.titolo)+'</span><code'+(m.da>1?' class="up"':'')+'>'+(m.da>1?'R'+m.da:hhmm(m.t))+'</code></button></li>').join('');
$('#script').addEventListener('click',ev=>{const b=ev.target.closest('button[data-m]');if(b)momento(+b.dataset.m);});
$('#ticks').addEventListener('click',ev=>{const b=ev.target.closest('button[data-m]');if(b){ev.stopPropagation();momento(+b.dataset.m);}});
$('#capX').addEventListener('click',chiudiCopione);
$('#roleMenu').innerHTML=Object.keys(RUOLI).map(k=>'<button role="menuitemradio" data-role="'+k+'" aria-checked="'+(k===S.role?'true':'false')+'"><b>'+esc(RUOLI[k].nome)+'</b><span>'+esc(RUOLI[k].chi)+'</span></button>').join('');
$('#roleBtn').addEventListener('click',()=>{const m=$('#roleMenu');m.hidden=!m.hidden;$('#roleBtn').setAttribute('aria-expanded',m.hidden?'false':'true');});
$('#roleMenu').addEventListener('click',ev=>{const b=ev.target.closest('button[data-role]');if(b)setRole(b.dataset.role);});
document.addEventListener('pointerdown',ev=>{if(!ev.target.closest('.role')){$('#roleMenu').hidden=true;$('#roleBtn').setAttribute('aria-expanded','false');}});
$('#pause').addEventListener('click',()=>pausa());
/* dopo un clic col puntatore il fuoco lascia il pulsante: la barra spaziatrice resta il comando di pausa */
document.addEventListener('click',ev=>{const b=ev.target.closest&&ev.target.closest('button');if(b&&ev.detail>0)b.blur();});
$$('[data-speed]').forEach(b=>b.addEventListener('click',()=>velocita(+b.dataset.speed)));
$('#segRel').addEventListener('click',ev=>{const b=ev.target.closest('button[data-rel]');if(b)setRel(+b.dataset.rel);});
$('#segScene').addEventListener('click',ev=>{const b=ev.target.closest('button[data-scene]');if(b)setScene(b.dataset.scene);});
$('#rotL').addEventListener('click',()=>ruota(-1));$('#rotR').addEventListener('click',()=>ruota(1));$('#home').addEventListener('click',()=>home());
$('#tabs').addEventListener('click',ev=>{const b=ev.target.closest('button[data-tab]');if(b){S.tab=+b.dataset.tab;renderList(SN);}});
$('#q').addEventListener('input',ev=>{S.query=ev.target.value;renderList(SN);});
$('#q').addEventListener('keydown',ev=>{if(ev.key==='Enter'){const r=$('#rows .row');if(r)r.click();}else if(ev.key==='Escape'){ev.target.value='';S.query='';ev.target.blur();renderList(SN);}});
$('#bell').addEventListener('click',()=>{const a=segnalazioni(SN)[0];if(a){seleziona(a.sel);inquadra(a.sel);}});
$('#rows').addEventListener('click',ev=>{const r=ev.target.closest('.row');if(!r)return;const k=r.dataset.key,sel=k.startsWith('p:')?{t:'p',id:k.slice(2)}:{t:'e',id:k};seleziona(sel);inquadra(sel);});
$('#detail').addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='chiudi')seleziona(null);else if(a==='inquadra')inquadra(S.sel);else if(a==='segui'){S.follow=!S.follow;emit('sel');}
  else if(a==='ok'||a==='no')decidiTu(a);else if(a==='rel')setRel(+b.dataset.rel);else if(a==='urgente'){const x=segnalazioni(SN)[0];if(x){seleziona(x.sel);inquadra(x.sel);}}});
/* cursore della giornata */
{const tr=$('#track');let drag=false;const at=ev=>{const r=tr.getBoundingClientRect(),p=parseFloat(getComputedStyle(tr).fontSize)*.25;vaiA((ev.clientX-r.left-p)/(r.width-2*p)*DAY);};
  tr.addEventListener('pointerdown',ev=>{if(ev.target.closest('button'))return;drag=true;tr.setPointerCapture(ev.pointerId);at(ev);});
  tr.addEventListener('pointermove',ev=>{if(drag)at(ev);});const up=()=>{drag=false;};tr.addEventListener('pointerup',up);tr.addEventListener('pointercancel',up);
  tr.addEventListener('keydown',ev=>{const k=ev.key;if(k==='ArrowLeft'||k==='ArrowRight'){ev.preventDefault();ev.stopPropagation();vaiA(S.t+(k==='ArrowLeft'?-5:5));}else if(k==='Home'){ev.preventDefault();vaiA(0);}else if(k==='End'){ev.preventDefault();vaiA(DAY);}});}
document.addEventListener('keydown',ev=>{if(ev.metaKey||ev.ctrlKey||ev.altKey)return;const k=ev.key;
  if(ev.target.matches('input,textarea'))return;
  if(k==='/'){ev.preventDefault();$('#q').focus();return;}
  if(k===' '){if(ev.target.closest('button'))return;ev.preventDefault();pausa();}else if(k==='Escape'){if(!$('#roleMenu').hidden){$('#roleMenu').hidden=true;return;}seleziona(null);}
  else if(k==='1')velocita(1);else if(k==='2')velocita(2);else if(k==='4')velocita(4);
  else if(k==='q'||k==='Q')ruota(-1);else if(k==='e'||k==='E')ruota(1);else if(k==='0')home();
  else if(k===',')vaiA(S.t-5);else if(k==='.')vaiA(S.t+5);
  else if(k==='+'||k==='='){cam.g.zoom*=1.2;W.dirty=true;}else if(k==='-'){cam.g.zoom/=1.2;W.dirty=true;}
  else if(k.startsWith('Arrow')&&!ev.target.closest('.track')){ev.preventDefault();const s=40;pan(k==='ArrowLeft'?s:k==='ArrowRight'?-s:0,k==='ArrowUp'?s:k==='ArrowDown'?-s:0);cam.g.tx=cam.tx;cam.g.tz=cam.tz;}});

function bindCanvas(){
  const cv=W.canvas,ptr=new Map();let moved=0,pinch=0,hoverRaf=0,hx=0,hy=0;
  const xy=ev=>{const r=cv.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top};};
  cv.addEventListener('pointerdown',ev=>{cv.setPointerCapture(ev.pointerId);ptr.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});moved=ptr.size>1?99:0;
    if(ptr.size===2){const a=[...ptr.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}});
  cv.addEventListener('pointermove',ev=>{const p=ptr.get(ev.pointerId);
    if(p){const dx=ev.clientX-p.x,dy=ev.clientY-p.y;p.x=ev.clientX;p.y=ev.clientY;
      if(ptr.size===1){moved+=Math.abs(dx)+Math.abs(dy);if(moved>5){pan(dx,dy);cv.classList.add('is-drag');}}
      else if(ptr.size===2){const a=[...ptr.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch>0){cam.g.zoom*=d/pinch;cam.zoom=cam.g.zoom;}pinch=d;W.dirty=true;}
      return;}
    const q=xy(ev);hx=q.x;hy=q.y;if(!hoverRaf)hoverRaf=requestAnimationFrame(()=>{hoverRaf=0;const h=pickAt(hx,hy),was=S.hover;
      if((h&&h.t)!==(was&&was.t)||(h&&h.id)!==(was&&was.id)){S.hover=h;cv.classList.toggle('is-hit',!!h);W.dirty=true;}});});
  const up=ev=>{if(!ptr.has(ev.pointerId))return;const solo=ptr.size===1;ptr.delete(ev.pointerId);cv.classList.remove('is-drag');
    if(solo&&moved<=5&&ev.type==='pointerup'){const q=xy(ev);seleziona(pickAt(q.x,q.y));}pinch=0;};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('pointerleave',()=>{if(S.hover){S.hover=null;cv.classList.remove('is-hit');W.dirty=true;}});
  cv.addEventListener('wheel',ev=>{ev.preventDefault();cam.g.zoom*=Math.exp(-ev.deltaY*.0016);W.dirty=true;},{passive:false});
  window.addEventListener('resize',()=>{resize();renderDay(SN);});if(window.ResizeObserver)new ResizeObserver(resize).observe(W.stage);
}

/* ================= 9. AVVIO E CICLO ================= */
function avvia(){
  let okGl=false;try{okGl=initScene();}catch(err){okGl=false;console.error(err);}
  if(okGl){mostraScena();bindCanvas();}
  else{const n=document.createElement('div');n.className='nogl';n.innerHTML='<p>La scena 3D non parte su questo dispositivo. Numeri, copione, giornata ed elenchi funzionano lo stesso, perché leggono gli stessi dati.</p>';$('#stage').appendChild(n);$('#c').hidden=true;$('.viewctl').hidden=true;}
  renderAll();
  let last=performance.now(),lastEmit=0;
  function frame(now){
    const dt=Math.min(1,(now-last)/1000);last=now;   // tetto al salto: una macchina lenta rallenta nel disegno, non nei dati
    if(!S.paused){S.t+=dt*S.speed;if(S.t>=DAY){S.t=DAY;S.fine=true;pausa(true);emit('fine');}}
    if(now-lastEmit>240){lastEmit=now;emit('tick');}
    if(W.ok)renderFrame(S.t,dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__cb={S,W,cam,get TL(){return TL;},get SN(){return SN;},fotografia,segnalazioni,momento,seleziona,pausa,velocita,setRel,setRole,setScene,vaiA,pickAt,decidiTu,MOMENTI,
    proietta(x,y,z){const r=W.canvas.getBoundingClientRect(),o=toScreen(x,y,z,{});return{x:r.left+o.x,y:r.top+o.y};},
    leggero(){if(W.ok){W.renderer.shadowMap.enabled=false;W.moon.castShadow=false;W.pr=.5;W.renderer.setPixelRatio(.5);W.renderer.setSize(W.cw,W.ch,false);W.dirty=true;}},
    step(t){pausa(true);S.fine=false;S.t=t;emit('test');this.disegna();},
    disegna(){if(W.ok){applyCam(1);sezione(1);S.tDraw=S.t;drawEntities(S.t);drawOverlay();W.renderer.render(W.scene,W.camera);}},
    screenOf(id){const r=W.ok?W.canvas.getBoundingClientRect():{left:0,top:0};const e=TL.byId.get(id);if(e&&e._sx!==undefined)return{x:r.left+e._sx,y:r.top+e._sy+6};
      const q=POS[S.scene][id];if(q){const o=toScreen(q[0],(S.scene==='fil'?yFil(q[1]):0)+Math.min(1.2,q[2]*.4),q[1],{});return{x:r.left+o.x,y:r.top+o.y};}return null;}};
}
if(document.fonts&&document.fonts.load){let done=false;const go=()=>{if(!done){done=true;avvia();}};Promise.all([document.fonts.load('700 30px "Bricolage Grotesque"'),document.fonts.load('500 14px "Geist"')]).then(go,go);setTimeout(go,1200);}else avvia();

})();
