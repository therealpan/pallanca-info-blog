<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="description" content="Borgolargo al Fiume, demo dell’intranet agentica per un piccolo Comune. Dati dimostrativi."><link rel="icon" href="/favicon.ico">
<title>City Brain Borgolargo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Impianto: borgo a rombo al centro, pannelli ai quattro angoli, barra in alto, processo in basso. Un solo tema, notturno per scelta. */
:root{
  color-scheme:dark;
  --ink-0:#070c13; --ink-1:#0e1621; --ink-2:#162130; --ink-3:#213042;
  --line:rgba(176,198,226,.15); --line-2:rgba(176,198,226,.3);
  --fg:#e9eef5; --fg-2:#a9b6c7; --fg-3:#7d8b9e;
  --lume:#ffd28a;            /* luce di finestra: l'unico accento */
  --ok:#7be0b0; --wait:#ffa23f; --stop:#ff6b62; --mute:#9db2d6; --pub:#8fd8ff;   /* stati, non accento */
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Geist","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px; --r-s:7px; --pad:14px; --gap:12px; --edge:12px;
  --ease-out:cubic-bezier(.23,1,.32,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink-0);color:var(--fg);font:13.5px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--lume);outline-offset:2px;border-radius:4px}
h1,h2,h3,p{margin:0}

.app{position:relative;height:100%;overflow:hidden}
.stage{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 42%,#15233a 0%,#0b131f 52%,var(--ink-0) 100%)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage canvas.is-drag{cursor:grabbing}
.stage canvas.is-hit{cursor:pointer}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* etichette dei luoghi */
.lbl{position:absolute;left:0;top:0;transform:translate(-9999px,0);white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;will-change:transform}
.lbl b{font:600 11.5px/1.2 var(--f-body);letter-spacing:.01em;padding:3px 8px;border-radius:99px;background:rgba(9,15,24,.78);border:1px solid var(--line);color:var(--fg)}
.lbl i{font:400 10px/1.2 var(--f-mono);font-style:normal;color:var(--fg-2);padding:1px 6px;border-radius:99px;background:rgba(9,15,24,.7)}
.lbl em{font:500 10px/1.2 var(--f-mono);font-style:normal;padding:2px 6px;border-radius:4px;background:rgba(9,15,24,.82);color:var(--fg-2);border:1px solid var(--line)}
.lbl em[data-tone="wait"]{color:var(--wait);border-color:rgba(255,162,63,.45)}
.lbl em[data-tone="stop"]{color:var(--stop);border-color:rgba(255,107,98,.45)}
.lbl em[data-tone="ok"]{color:var(--ok);border-color:rgba(123,224,176,.4)}
.lbl em:empty,.lbl i:empty{display:none}
.app[data-view="sindaco"] .lbl i{display:none}
.lbl.is-on b{border-color:var(--lume);color:var(--lume)}
.lbl.is-minor.is-far{opacity:0}
.tag{position:absolute;z-index:2;left:0;top:0;transform:translate(-9999px,0);white-space:nowrap;font:500 11px/1.25 var(--f-body);padding:5px 9px;border-radius:var(--r-s);background:rgba(9,15,24,.94);border:1px solid var(--line-2);max-width:300px;overflow:hidden;text-overflow:ellipsis}
.tag span{font-family:var(--f-mono);color:var(--fg-3);margin-right:6px}

/* superfici */
.panel{position:absolute;z-index:3;background:var(--ink-1);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 40px -18px rgba(0,0,0,.7)}
.eyebrow{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.prop{font:500 9.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--pub);border:1px dashed rgba(143,216,255,.5);border-radius:4px;padding:2px 5px;vertical-align:1px;white-space:nowrap}

/* barra */
.bar{position:absolute;z-index:4;left:var(--edge);right:var(--edge);top:calc(var(--edge) + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:var(--gap);padding:8px 10px 8px 12px;background:var(--ink-1);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 40px -18px rgba(0,0,0,.7)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand svg{flex:none}
.brand h1{font:700 17px/1.1 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.brand p{font:400 11px/1.3 var(--f-body);color:var(--fg-3);white-space:nowrap}
.demo .s{display:none}
.demo{flex:none;font:500 10px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--lume);border:1px solid rgba(255,210,138,.45);padding:4px 7px;border-radius:5px;white-space:nowrap}
.search{flex:1 1 180px;min-width:120px;max-width:340px;position:relative}
.search input{width:100%;height:34px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--ink-0);padding:0 10px 0 30px;outline-offset:0}
.search input::placeholder{color:var(--fg-3)}
.search svg{position:absolute;left:9px;top:10px;pointer-events:none}
.grow{flex:1 1 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-s);padding:2px;background:var(--ink-0);gap:2px}
.seg button{height:28px;padding:0 10px;border-radius:5px;color:var(--fg-2);font-weight:500;white-space:nowrap;transition:background-color 160ms var(--ease-out),color 160ms var(--ease-out),transform 120ms var(--ease-out)}
.seg button:active{transform:scale(.97)}
.seg button[aria-pressed="true"]{background:var(--ink-3);color:var(--fg)}
.clock{font:500 19px/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em;min-width:58px;text-align:center}
.clock small{display:block;font:400 9.5px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);margin-top:3px;white-space:nowrap}
.ibtn{height:32px;min-width:32px;padding:0 9px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--ink-0);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;white-space:nowrap;transition:background-color 160ms var(--ease-out),border-color 160ms var(--ease-out),transform 120ms var(--ease-out)}
.ibtn:active{transform:scale(.97)}
.ibtn[aria-pressed="true"]{border-color:var(--lume);color:var(--lume)}
@media (hover:hover) and (pointer:fine){
  .seg button:hover{color:var(--fg)}
  .ibtn:hover{background:var(--ink-2);border-color:var(--line-2)}
}

/* numeri chiave */
.kpi{left:var(--edge);top:calc(78px + env(safe-area-inset-top,0px));width:292px;padding:var(--pad)}
.kpi-main{display:grid;gap:10px;margin-top:10px}
.kpi-main div{display:grid;grid-template-columns:62px 1fr;align-items:center;column-gap:10px}
.kpi-main strong{font:700 34px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-align:right}
.kpi-main span{font-weight:500;line-height:1.25}
.kpi-main small{display:block;font-size:11.5px;font-weight:400;color:var(--fg-3)}
.kpi-main div[data-tone="wait"] strong{color:var(--wait)}
.kpi-sub{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.kpi-sub dl{margin:8px 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi-sub dt{font-size:11px;color:var(--fg-3);line-height:1.25;order:2}
.kpi-sub dd{margin:0;font:500 19px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.kpi-sub dl>div{display:flex;flex-direction:column;gap:3px;min-width:0}

/* scheda */
.detail{right:var(--edge);top:calc(78px + env(safe-area-inset-top,0px));width:316px;max-height:calc(100% - 78px - 262px);overflow:auto;padding:var(--pad)}
.detail h2{font:700 17px/1.2 var(--f-display);letter-spacing:-.005em;margin-top:6px;text-wrap:balance}
.detail .lead{color:var(--fg-2);margin-top:6px;max-width:44ch}
.facts{margin:11px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.facts dt{color:var(--fg-3);font-size:12px}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{height:32px;padding:0 12px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--ink-2);font-weight:500;transition:background-color 160ms var(--ease-out),transform 120ms var(--ease-out)}
.btn:active{transform:scale(.97)}
.btn.go{background:var(--ok);border-color:var(--ok);color:#06241a}
.btn.no{border-color:rgba(255,107,98,.6);color:var(--stop)}
.btn[aria-pressed="true"]{border-color:var(--lume);color:var(--lume)}
.legend{margin:0;padding:0;list-style:none;display:grid;gap:7px;align-content:start}
.leg2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:11px}
.legend li{display:grid;grid-template-columns:16px 1fr;align-items:center;gap:8px;color:var(--fg);font-size:12.5px;line-height:1.25}
.legend b{color:var(--fg);font-weight:500}
.sub{margin-top:13px;padding-top:11px;border-top:1px solid var(--line)}
.note{margin-top:10px;font-size:12px;color:var(--fg-3)}

/* glifi di forma e stato */
.g{width:14px;height:14px;display:inline-block;flex:none;justify-self:center;position:relative;color:var(--fg-2)}
.g[data-g="sfera"]{border-radius:50%;background:currentColor}
.g[data-g="diamante"]{background:currentColor;transform:rotate(45deg) scale(.78)}
.g[data-g="foglio"]{background:currentColor;height:10px;margin-top:2px;border-radius:1px;transform:skewX(-14deg)}
.g[data-g="cubo"]{background:currentColor;border-radius:2px;transform:scale(.82)}
.g[data-g="pedina"]{background:currentColor;width:8px;border-radius:5px 5px 2px 2px}
.g[data-g="anello"]{border:2.5px solid currentColor;border-radius:50%}
.g[data-g="doppio"]{border:2px solid currentColor;border-radius:50%}
.g[data-g="doppio"]::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:currentColor}
.g[data-g="stop"]{background:currentColor;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.g[data-g="citata"]{border-radius:50%;background:currentColor}
.g[data-g="citata"]::after{content:"";position:absolute;right:-4px;top:-4px;width:7px;height:9px;background:var(--fg);border-radius:1px}
.t-go{color:var(--lume)} .t-pub{color:var(--pub)} .t-ok{color:var(--ok)} .t-wait{color:var(--wait)} .t-stop{color:var(--stop)} .t-mute{color:var(--mute)}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:500;line-height:1.25}
.chip .g{width:11px;height:11px}
.chip .g[data-g="citata"]::after{width:5px;height:7px;right:-3px;top:-3px}

/* copione */
.script{left:var(--edge);bottom:calc(var(--edge) + env(safe-area-inset-bottom,0px));width:292px;padding:var(--pad)}
.script ol{margin:9px 0 0;padding:0;list-style:none;display:grid;gap:4px;counter-reset:m}
.script li{counter-increment:m}
.script li button{width:100%;display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;text-align:left;padding:6px 8px;border-radius:var(--r-s);border:1px solid transparent;font-weight:500;transition:background-color 160ms var(--ease-out),transform 120ms var(--ease-out)}
.script li button::before{content:counter(m);font:500 11px/20px var(--f-mono);width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2);text-align:center;color:var(--fg-2)}
.script li button:active{transform:scale(.985)}
.script li button[aria-current="true"]{background:var(--ink-2);border-color:var(--line-2)}
.script li button[aria-current="true"]::before{background:var(--lume);border-color:var(--lume);color:#2a1c00}
@media (hover:hover) and (pointer:fine){.script li button:hover{background:var(--ink-2)}.btn:hover{background:var(--ink-3)}.btn.go:hover{background:#93ebc0}}

/* processo */
.flow{left:calc(var(--edge) + 292px + var(--gap));right:calc(var(--edge) + 336px + var(--gap));bottom:calc(var(--edge) + env(safe-area-inset-bottom,0px));padding:10px 12px}
.flow ol{margin:8px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.flow li button{width:100%;text-align:left;padding:7px 8px;border-radius:var(--r-s);background:var(--ink-0);border:1px solid var(--line);display:grid;gap:2px;transition:border-color 160ms var(--ease-out),transform 120ms var(--ease-out)}
.flow li button:active{transform:scale(.98)}
.flow li strong{font:500 20px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.flow li span{font-size:11px;line-height:1.2;color:var(--fg-2);overflow-wrap:anywhere}
.flow li button[data-n="0"] strong{color:var(--fg-3)}
.flow li button[data-tone="wait"]:not([data-n="0"]) strong{color:var(--wait)}
@media (hover:hover) and (pointer:fine){.flow li button:hover{border-color:var(--line-2)}}

/* didascalia del copione */
.caption{position:absolute;z-index:3;left:50%;bottom:calc(var(--edge) + 104px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 700px));min-width:300px;transform:translateX(-50%);padding:11px 14px;background:rgba(9,15,24,.96);border:1px solid var(--line-2);border-radius:var(--r);display:grid;grid-template-columns:1fr auto;gap:4px 12px;transition:opacity 220ms var(--ease-out),transform 220ms var(--ease-out)}
.caption[hidden]{display:none!important}
.caption h3{font:700 14.5px/1.2 var(--f-display)}
.caption p{grid-column:1;color:var(--fg-2);max-width:60ch}
.caption button{grid-row:1/3;grid-column:2;align-self:start}
@starting-style{.caption{opacity:0;transform:translateX(-50%) translateY(6px)}}

/* elenco */
.list{right:var(--edge);bottom:calc(var(--edge) + env(safe-area-inset-bottom,0px));width:336px;height:238px;display:flex;flex-direction:column;padding:var(--pad) 0 0}
.list header{padding:0 var(--pad) 9px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.list .seg button{height:24px;padding:0 7px;font-size:12px}
.rows{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line);padding:4px}
.row{width:100%;display:grid;grid-template-columns:50px 1fr;gap:1px 8px;text-align:left;padding:6px 10px;border-radius:var(--r-s);border:1px solid transparent}
.row code{font:400 11px/1.5 var(--f-mono);color:var(--fg-3);grid-row:1/3}
.row b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .chip{font-size:11.5px;font-weight:400;color:var(--fg-2)}
.row[aria-current="true"]{background:var(--ink-2);border-color:var(--line-2)}
.empty{padding:18px var(--pad);color:var(--fg-3)}
@media (hover:hover) and (pointer:fine){.row:hover{background:var(--ink-2)}}

/* comandi di vista */
.viewctl{position:absolute;z-index:3;right:calc(var(--edge) + 336px + var(--gap));top:calc(78px + env(safe-area-inset-top,0px));display:flex;gap:6px}
.viewctl .ibtn{background:var(--ink-1)}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--fg-2)}
.nogl p{max-width:42ch}

/* schermo medio */
@media (max-width:1240px){
  .kpi,.script{width:248px}
  .detail{width:272px}
  .list{width:288px}
  .flow{left:calc(var(--edge) + 248px + var(--gap));right:calc(var(--edge) + 288px + var(--gap))}
  .viewctl{right:calc(var(--edge) + 272px + var(--gap))}
  .caption{width:min(460px,calc(100% - 600px))}
  .brand p,.clock small,.demo .l,#pauseTxt,.detail .lead:not(.chip),.detail .note{display:none}
  .demo .s{display:inline}
  .bar{gap:8px}
  .search{flex:1 1 90px;min-width:84px}
  .flow ol{grid-template-columns:repeat(3,minmax(0,1fr))}
  .caption{bottom:calc(var(--edge) + 150px + env(safe-area-inset-bottom,0px))}
  .kpi-main strong{font-size:28px}
  .kpi-main div{grid-template-columns:50px 1fr}
}
/* schermo stretto: scena in alto, pannelli in colonna */
@media (max-width:980px){
  body{overflow:auto}
  .app{height:auto;overflow:visible;display:flex;flex-direction:column;gap:var(--gap);padding-inline:16px;padding-block:12px 20px}
  .bar,.panel,.stage,.caption,.viewctl{position:relative;inset:auto;left:auto;right:auto;top:auto;bottom:auto;width:auto;transform:none}
  .bar{flex-wrap:wrap;order:0}
  .search{flex-basis:100%;max-width:none;order:9}
  .grow{display:none}
  .stage{order:1;height:clamp(300px,50vh,440px);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
  .viewctl{position:absolute;right:8px;top:8px;left:auto}
  .caption{order:2;min-width:0;width:auto}
  .kpi{order:3}.script{order:4}.flow{order:5}.detail{order:6;max-height:none}.list{order:7;height:320px}
  .flow ol{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand p,.detail .lead:not(.chip),.detail .note{display:block}
  .demo .l,#pauseTxt{display:inline}
  .demo .s{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:0ms!important}}
</style>

</head><body>
<div class="app" id="app" data-view="sindaco">
  <div class="stage" id="stage">
    <canvas id="c" aria-label="Scena del borgo: trascina per spostare, rotella per lo zoom"></canvas>
    <div class="labels" id="labels"><div class="tag" id="tag"></div></div>
    <div class="viewctl">
      <button class="ibtn" id="rotL" title="Ruota a sinistra (Q)" aria-label="Ruota a sinistra"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a5 5 0 1 0 1.6-3.7"/><path d="M2.4 2.6v2.8h2.8"/></svg></button>
      <button class="ibtn" id="rotR" title="Ruota a destra (E)" aria-label="Ruota a destra"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13.6 2.6v2.8h-2.8"/></svg></button>
      <button class="ibtn" id="home" title="Torna alla vista iniziale (0)">Vista iniziale</button>
    </div>
  </div>

  <header class="bar">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M4 3h22v13c0 6-5 9.5-11 11.5C9 25.500 4 22 4 16z" fill="#162130" stroke="#ffd28a" stroke-width="1.4"/><path d="M8 17c2.300-4.500 11.700-4.500 14 0" fill="none" stroke="#ffd28a" stroke-width="1.6"/><path d="M8 20.500c2 1.200 3.500-1.200 5.500 0s3.500-1.200 5.500 0 2 .4 3 0" fill="none" stroke="#8fd8ff" stroke-width="1.3" stroke-linecap="round"/><circle cx="15" cy="9.500" r="2.200" fill="#ffd28a"/></svg>
      <div><h1>Borgolargo al Fiume</h1><p>City Brain, il Comune e la sua memoria</p></div>
    </div>
    <span class="demo"><span class="l">Dati dimostrativi</span><span class="s">Demo</span></span>
    <label class="search"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#7d8b9e" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="m11 11 3 3"/></svg><input id="q" type="search" placeholder="Cerca un luogo o una richiesta" autocomplete="off" aria-label="Cerca nella scena"></label>
    <span class="grow"></span>
    <div class="seg" role="group" aria-label="Vista"><button data-view="sindaco" aria-pressed="true">Sindaco</button><button data-view="architettura" aria-pressed="false">Architettura</button></div>
    <div class="seg" role="group" aria-label="Momento della giornata"><button id="jDay" aria-pressed="true">Uffici aperti</button><button id="jEve" aria-pressed="false">Sera</button></div>

function route(a,b){
  const k=a+'>'+b;if(RC.has(k))return RC.get(k);

  {id:'gestionali',nome:'Sui gestionali',st:['approvata','automatica','esecuzione','eseguita']},
  {id:'steward',nome:'Dallo steward',st:['sotto_soglia','attesa_steward','prop_viaggio'],tone:'wait'}
];

/* ================= 2. STORE: lo stato unico ================= */
const START=8*60+15, STEP_DT=0.25, V_LUCE=3.6, V_PASSO=1.0, V_AUTO=2.6;
const S={t:0,offset:0,speed:1,paused:false,view:'sindaco',sel:null,hover:null,follow:false,filter:'lavoro',query:'',
  ents:new Map(),seq:0,aperti:true,qAppr:Array(6).fill(null),qStew:Array(6).fill(null),park:Array(PARK.length).fill(null),
  sentiero:{stato:'aperto',atto:null},varcoStop:-9,flash:{protocollo:-9,albo:-9,tributi:-9},memBase:1284,spot:{},timers:[],
  nextFirma:6,nextSteward:8,gen:{dom:1,az:3,scan:2,cit:2,bus:1,auto:4},today:null,copione:null};
function azzera(){S.today={domande:0,citate:0,astensioni:0,negati:0,eseguite:0,approvate:0,rifiutate:0,escluse:0,T1:0,T2:0,T3:0,
  pagine:0,sotto:0,propOk:0,propNo:0,memoria:0,pubDomande:0,pubRisolte:0,pubAst:0,fermate:0,lingue:new Set(),arrivati:0,da:{}};}
const daDove=o=>{S.today.da[o]=(S.today.da[o]||0)+1;};
azzera();
const subs=[];function onStore(f){subs.push(f);}function emit(why){for(const f of subs)f(why||'tick');}
const clock=()=>((START+S.t+S.offset)%1440+1440)%1440;
const hhmm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(Math.floor(m%60)).padStart(2,'0');
function evento(c){c=c===undefined?clock():c;let pross=null;for(const e of EVENTI){if(c>=e.da&&c<e.a)return{...e,stato:'in corso'};if(c<e.da&&!pross)pross=e;}
  return pross?{...pross,stato:'in programma'}:{...EVENTI[EVENTI.length-1],stato:'concluso'};}
const quanti=fn=>{let n=0;for(const e of S.ents.values())if(fn(e))n++;return n;};
const inStato=(...st)=>quanti(e=>st.includes(e.stato));

/* ================= 3. SIMULAZIONE: un numero cambia solo quando accade l'evento che lo causa ================= */
function mk(kind,o){const id=KIND[kind].pre+'-'+String(++S.seq).padStart(3,'0');
  const e=Object.assign({id,kind,nato:S.t,stato:'',tone:'go',pos:{x:0,y:0,z:0},node:null,motion:null,at:null,fn:null,slot:null,coda:null,canale:'interno'},o);
  S.ents.set(id,e);return e;}
function stato(e,k){e.stato=k;e.tone=STATI[k][1];e.dal=S.t;}
function metti(e,node){e.node=node;const n=N[node];e.pos={x:n.x,y:n.y,z:n.z};e.motion=null;}
function sched(e,dt,fn){e.at=S.t+dt;e.fn=fn;}
function viaggia(e,to,v,fn,coda,testa){
  const pts=[{x:e.pos.x,y:e.pos.y||0,z:e.pos.z}];
  const add=p=>{const l=pts[pts.length-1];if(Math.hypot(p.x-l.x,p.z-l.z)>0.02)pts.push({x:p.x,y:p.y||0,z:p.z});};
  if(testa)testa.forEach(add);
  route(e.node,to).ids.forEach(id=>add(N[id]));
  if(coda)coda.forEach(add);
  const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y,pts[i].z-pts[i-1].z));
  const len=cum[cum.length-1],dur=Math.max(0.3,len/v);
  e.motion={pts,cum,len,t0:S.t,dur};e.node=to;sched(e,dur,fn);return dur;
}
function posa(e){if(e.motion){const p=e.motion.pts[e.motion.pts.length-1];e.pos={x:p.x,y:p.y,z:p.z};e.motion=null;}}
function posOf(e,t,out){
  out=out||{};const m=e.motion;
  if(!m){out.x=e.pos.x;out.y=e.pos.y||0;out.z=e.pos.z;out.dx=0;out.dz=0;return out;}
  let u=(t-m.t0)/m.dur;u=u<0?0:u>1?1:u;const s=u*m.len;let i=1;while(i<m.cum.length-1&&m.cum[i]<s)i++;
  const a=m.pts[i-1],b=m.pts[i],seg=m.cum[i]-m.cum[i-1]||1,k=(s-m.cum[i-1])/seg;
  out.x=a.x+(b.x-a.x)*k;out.y=a.y+(b.y-a.y)*k;out.z=a.z+(b.z-a.z)*k;out.dx=b.x-a.x;out.dz=b.z-a.z;return out;
}
function libera(e){if(e.coda==='ctrl'&&S.qAppr[e.slot]===e.id)S.qAppr[e.slot]=null;if(e.coda==='stew'&&S.qStew[e.slot]===e.id)S.qStew[e.slot]=null;
  if(e.coda==='park'&&S.park[e.slot]===e.id)S.park[e.slot]=null;e.coda=null;}
function togli(e){libera(e);S.ents.delete(e.id);
  if(S.sel&&S.sel.t==='e'&&S.sel.id===e.id){S.sel={t:'g',snap:Object.assign({},e)};S.follow=false;}
  if(S.hover&&S.hover.id===e.id)S.hover=null;}
function spot(k){S.spot[k]=(S.spot[k]||0)+1;return S.spot[k]-1;}
function alBrain(e){posa(e);const d=N[e.node],cx=P.brain.x,cz=P.brain.z,base=Math.atan2(d.z-cz,d.x-cx);
  const n=quanti(o=>o!==e&&o.node===e.node&&!o.motion&&(o.stato==='nel_brain'||o.stato==='prepara'));
  const a=base+((n%5)-2)*0.21*(n%2?1:-1),r=3.0;e.pos={x:cx+Math.cos(a)*r,y:0,z:cz+Math.sin(a)*r};}

const STEP={
  rimuovi(e){togli(e);},
  fine(e){posa(e);e.esce=S.t;sched(e,1.4,'rimuovi');},
  // domanda di un ufficio
  dom_brain(e){alBrain(e);stato(e,'nel_brain');sched(e,rnd(2,3.2),'dom_esito');},
  dom_esito(e){e.noto=true;
    if(e.esito==='citata'){S.today.citate++;stato(e,'risposta_citata');viaggia(e,DOOR[e.origine],V_LUCE,'fine');}
    else if(e.esito==='astensione'){S.today.astensioni++;stato(e,'astensione');viaggia(e,DOOR[e.origine],V_LUCE,'fine');}
    else{S.today.negati++;stato(e,'accesso_negato');e.esce=S.t+2.6;sched(e,4,'rimuovi');}},
  // azione
  az_brain(e){alBrain(e);stato(e,'prepara');sched(e,rnd(1.6,2.4),'az_parti');},
  az_parti(e){stato(e,'al_controllo');viaggia(e,'dCtrl',V_LUCE,'az_ctrl');},
  az_ctrl(e){posa(e);stato(e,'classificazione');sched(e,1.3,'az_classe');},
  az_classe(e){
    if(e.livello==='escluso'){S.today.escluse++;stato(e,'esclusa');e.noto=true;e.esce=S.t+3.6;sched(e,5,'rimuovi');return;}
    if(e.livello==='T1'){stato(e,'automatica');vaiAlSistema(e);return;}
    const i=S.qAppr.indexOf(null);if(i<0){sched(e,1,'az_classe');return;}
    S.qAppr[i]=e.id;e.slot=i;e.coda='ctrl';stato(e,'attesa_funzionario');viaggia(e,'dCtrl',V_LUCE,'az_attesa',[slotCtrl(i)]);},
  az_attesa(e){posa(e);e.inCoda=S.t;if(e.rapida)e.approvaAt=S.t+1.8;},
  az_exec(e){posa(e);stato(e,'esecuzione');S.flash[e.sistema]=S.t+3;sched(e,1.6,'az_fatta');},
  az_fatta(e){stato(e,'eseguita');e.noto=true;S.today.eseguite++;S.today[e.livello]++;
    if(e.effetto==='chiudi_sentiero'){S.sentiero={stato:'chiuso',atto:'Ordinanza n. 41/2026'};
      S.timers.push({at:S.t+1.5,fn:()=>{const q=spawnPubblica(Q_VIS.sentiero,'infopoint',{lang:'en'});if(S.hook)S.hook('sentiero',q);}});
      S.timers.push({at:S.t+3.5,fn:()=>spawnPubblica(Q_CIT[5],'sportello',{lang:'it'})});}
    if(e.livello!=='T1'&&(e.effetto||chance(.6)))spawnProposta(e);
    e.esce=S.t+1.6;sched(e,3,'rimuovi');},
  // proposta di scrittura e pagine sotto soglia: stesso banco, stessa persona
  st_attesa(e){posa(e);stato(e,'attesa_steward');e.pronta=S.t+rnd(5,10);},
  mem_in(e){posa(e);S.today.memoria++;if(e.kind==='proposta')S.today.propOk++;else S.today.pagine++;e.esce=S.t;sched(e,1.2,'rimuovi');},
  // pagina scansionata
  sc_esito(e){
    if(e.qualita>=SOGLIA){stato(e,'letta');e.noto=true;viaggia(e,brainDoor('dScan'),V_LUCE,'mem_in');return;}
    const i=S.qStew.indexOf(null);if(i<0){sched(e,2,'sc_esito');return;}
    S.today.sotto++;e.noto=true;S.qStew[i]=e.id;e.slot=i;e.coda='stew';stato(e,'sotto_soglia');viaggia(e,'dStew',V_LUCE,'st_attesa',[slotStew(i)]);},
  // domanda dal canale pubblico
  pb_varco(e){posa(e);stato(e,'al_varco');sched(e,1.2,'pb_filtro');},
  pb_filtro(e){
    if(e.esito==='fermata'){S.today.fermate++;e.noto=true;stato(e,'fermata_al_varco');S.varcoStop=S.t+5;sched(e,2.4,'pb_indietro');}
    else{stato(e,'in_viaggio');viaggia(e,brainDoor('varco'),V_LUCE,'pb_brain');}},
  pb_indietro(e){viaggia(e,DOOR[e.origine],V_LUCE,'pb_fine');},
  pb_brain(e){alBrain(e);stato(e,'nel_brain');sched(e,rnd(1.8,2.8),'pb_esito');},
  pb_esito(e){e.noto=true;
    if(e.tema==='sentiero'){const ch=S.sentiero.stato==='chiuso';e.risposta=ch?'Chiuso':'Aperto';e.fonte=ch?S.sentiero.atto:'Stato dei sentieri, aggiornamento del giorno';}
    if(e.esito==='citata'){S.today.pubRisolte++;S.today.lingue.add(e.lang);stato(e,'risposta_citata');}
    else{S.today.pubAst++;stato(e,'astensione');}
    viaggia(e,DOOR[e.origine],V_LUCE,'pb_fine');},
  pb_fine(e){posa(e);if(e.visitatore){const v=S.ents.get(e.visitatore);if(v)risposto(v,e);}e.esce=S.t;sched(e,1.4,'rimuovi');},
  // visitatore
  vi_parti(e){stato(e,'vis_arrivo');viaggia(e,'dInfo',V_PASSO*e.passo,'vi_info',[infoSpot(spot('info'))]);},
  vi_info(e){posa(e);stato(e,'vis_info');sched(e,rnd(.4,2.5),'vi_chiede');},
  vi_chiede(e){const q=spawnPubblica(Q_VIS[e.tema],'infopoint',{lang:e.lang,visitatore:e.id});e.domanda=q.id;},
  vi_visita(e){posa(e);stato(e,'vis_visita');sched(e,rnd(16,34),'vi_torna');},
  vi_torna(e){stato(e,'vis_partenza');viaggia(e,'dFerm',V_PASSO*e.passo,'vi_attesa',[fermSpot(spot('ferm'))]);},
  vi_attesa(e){posa(e);stato(e,'vis_attesa');},
  // corriera e auto
  bus_stop(e){posa(e);stato(e,'bus_fermata');
    for(const v of[...S.ents.values()])if(v.kind==='visitatore'&&v.stato==='vis_attesa')togli(v);
    const c=clock(),n=(c<20*60+30&&quanti(v=>v.kind==='visitatore')<11)?e.bordo:0;e.bordo=n;
    for(let i=0;i<n;i++)spawnVisitatore(i);S.today.arrivati+=n;sched(e,2.6,'bus_via');},
  bus_via(e){stato(e,'bus_partenza');viaggia(e,'eX',V_AUTO,'rimuovi');},
  au_sosta(e){posa(e);stato(e,'auto_sosta');sched(e,rnd(35,80),'au_via');},
  au_via(e){const s=PARK[e.slot];libera(e);stato(e,'auto_partenza');e.node='eP';viaggia(e,'eX',V_AUTO,'rimuovi',null,[{x:s.x,z:11.5},{x:14,z:11.5}]);}
};
function vaiAlSistema(e){const s=SYS[e.sistema];viaggia(e,'gGate',V_LUCE,'az_exec',[{x:s.x+1.5,z:s.z}]);}
function risposto(v,q){
  let dest=v.tema==='museo'?'museo':v.tema==='sentiero'?(S.sentiero.stato==='chiuso'?'museo':'sentieri'):'eventi';
  v.dest=dest;v.esitoDomanda=q.esito==='citata'?(q.risposta?q.risposta+', '+q.fonte:q.fonte):'Nessuna risposta: fonte assente';
  stato(v,'vis_cammino');viaggia(v,DESTNODE[dest],V_PASSO*v.passo,'vi_visita',[SPOTS[dest](spot(dest))]);
}
function spawnDomanda(tpl,o){const e=mk('domanda',Object.assign({titolo:tpl.q,origine:tpl.o,esito:tpl.esito,fonte:tpl.fonte,motivo:tpl.motivo,livello:'T0'},o));
  metti(e,DOOR[tpl.o]);stato(e,'in_viaggio');S.today.domande++;daDove(tpl.o);viaggia(e,brainDoor(e.node),V_LUCE,'dom_brain');return e;}
function spawnAzione(tpl,o){const e=mk('azione',Object.assign({titolo:tpl.a,origine:tpl.o,livello:tpl.liv,sistema:tpl.sis,motivo:tpl.motivo,effetto:tpl.effetto,
    firme:0,richieste:tpl.liv==='T3'?2:tpl.liv==='T2'?1:0},o));
  metti(e,DOOR[tpl.o]);stato(e,'in_viaggio');viaggia(e,brainDoor(e.node),V_LUCE,'az_brain');return e;}
function spawnScan(q){const n=10+Math.floor(R()*180),i=spot('scan')%3;
  const e=mk('scansione',{titolo:pick(SCAN_T)(n),origine:'archivio',qualita:q!==undefined?q:(chance(.24)?rnd(.52,.78):rnd(.84,.98))});
  e.node='dScan';const p=scanSpot(i);e.pos={x:p.x,y:0,z:p.z};stato(e,'lettura_ottica');sched(e,rnd(2.4,3.6),'sc_esito');return e;}
function spawnProposta(src){const i=S.qStew.indexOf(null);if(i<0||S.qStew.filter(x=>x===null).length<2)return null;
  const s=SYS[src.sistema],e=mk('proposta',{titolo:'Esito da ricordare: '+src.titolo.charAt(0).toLowerCase()+src.titolo.slice(1),origine:'gestionali',daAzione:src.id,confidenza:rnd(.74,.97)});
  e.node='gGate';e.pos={x:s.x+1.5,y:0,z:s.z};S.qStew[i]=e.id;e.slot=i;e.coda='stew';stato(e,'prop_viaggio');viaggia(e,'dStew',V_LUCE,'st_attesa',[slotStew(i)]);return e;}
function spawnPubblica(tpl,origine,o){const e=mk('pubblica',Object.assign({titolo:tpl.q,origine,canale:'pubblico',esito:tpl.esito,fonte:tpl.fonte,motivo:tpl.motivo,tema:tpl.k,livello:'T0',lang:'it'},o));
  metti(e,DOOR[origine]);stato(e,'verso_varco');S.today.pubDomande++;daDove(origine);viaggia(e,'varco',V_LUCE,'pb_varco');return e;}
function spawnVisitatore(i){const r=R(),lang=r<.38?'it':r<.68?'en':r<.88?'fr':'de',t=R();
  const tema=t<.3?'sentiero':t<.52?'museo':t<.74?'evento':t<.88?'parcheggio':'ristorante';
  const e=mk('visitatore',{titolo:'Visitatore, parla '+LANG[lang],canale:'pubblico',lang,tema,passo:rnd(.85,1.15),tinta:R()});
  const p=fermSpot(i);e.node='dFerm';e.pos={x:p.x,y:0,z:p.z};stato(e,'vis_arrivo');sched(e,.4+i*.7,'vi_parti');return e;}
function spawnBus(){const e=mk('corriera',{titolo:'Corriera della valle',canale:'pubblico',bordo:2+Math.floor(R()*3)});metti(e,'eX');stato(e,'bus_arrivo');viaggia(e,'eF',V_AUTO,'bus_stop');return e;}
function spawnAuto(parcheggiata){const liberi=[];S.park.forEach((v,i)=>{if(v===null)liberi.push(i);});if(!liberi.length)return null;
  const i=pick(liberi),s=PARK[i],e=mk('auto',{titolo:'Auto al posto '+(i+1),canale:'pubblico',tinta:R()});S.park[i]=e.id;e.slot=i;e.coda='park';
  if(parcheggiata){e.node='eP';e.pos={x:s.x,y:0,z:s.z};stato(e,'auto_sosta');sched(e,rnd(10,70),'au_via');}
  else{metti(e,'eX');stato(e,'auto_arrivo');viaggia(e,'eP',V_AUTO,'au_sosta',[{x:14,z:11.5},{x:s.x,z:11.5},{x:s.x,z:s.z}]);}
  return e;}

function firma(e,chi){ // una firma: del funzionario simulato o di chi guarda la demo
  if(!e||e.coda!=='ctrl'||e.motion)return false;
  e.firme++;e.ultimaFirma=chi||'funzionario';
  if(e.firme<e.richieste){stato(e,'attesa_seconda_firma');e.seconda=S.t+rnd(4,8);return true;}
  libera(e);S.today.approvate++;stato(e,'approvata');vaiAlSistema(e);return true;}
function rifiuta(e){if(!e||e.coda!=='ctrl'||e.motion)return false;libera(e);S.today.rifiutate++;e.noto=true;stato(e,'rifiutata');viaggia(e,DOOR[e.origine],V_LUCE,'fine');return true;}
const inAttesa=()=>[...S.ents.values()].filter(e=>e.coda==='ctrl'&&!e.motion).sort((a,b)=>a.inCoda-b.inCoda);

function persone(){ // funzionario e steward lavorano solo a uffici aperti
  if(!S.aperti)return;
  for(const e of inAttesa()){
    if(e.manuale)continue;
    if(e.approvaAt&&S.t>=e.approvaAt&&e.stato==='attesa_funzionario'){firma(e);continue;}
    if(e.stato==='attesa_seconda_firma'&&S.t>=e.seconda){firma(e,'segretario');}
  }
  if(S.t>=S.nextFirma){const e=inAttesa().find(x=>!x.manuale&&!x.approvaAt&&x.stato==='attesa_funzionario'&&S.t-x.inCoda>5);
    if(e){if(e.livello==='T2'&&chance(.14))rifiuta(e);else firma(e);S.nextFirma=S.t+rnd(8,14);}else S.nextFirma=S.t+1;}
  if(S.t>=S.nextSteward){const e=[...S.ents.values()].filter(x=>x.stato==='attesa_steward'&&S.t>=x.pronta).sort((a,b)=>a.pronta-b.pronta)[0];
    if(e){libera(e);e.noto=true;
      if(e.kind==='proposta'){if(chance(.86)){stato(e,'prop_ok');viaggia(e,brainDoor('dStew'),V_LUCE,'mem_in');}else{S.today.propNo++;stato(e,'prop_no');e.esce=S.t+1.6;sched(e,3,'rimuovi');}}
      else{if(chance(.6)){stato(e,'riletta');viaggia(e,brainDoor('dStew'),V_LUCE,'mem_in');}else{stato(e,'scartata');e.esce=S.t+1.6;sched(e,3,'rimuovi');}}
      S.nextSteward=S.t+rnd(4,7);}else S.nextSteward=S.t+1;}
}
function scegliAzione(){const pend=quanti(e=>e.kind==='azione'&&(e.livello==='T2'||e.livello==='T3')&&!['approvata','esecuzione','eseguita','rifiutata'].includes(e.stato));
  const r=R();let k=r<.34?'T1':r<.80?'T2':r<.92?'T3':'escluso';if((k==='T2'||k==='T3')&&pend>=4)k='T1';return pick(AZ[k]);}
function generatori(){
  const c=clock(),g=S.gen;
  if(S.aperti){
    if(S.t>=g.dom){spawnDomanda(pick(Q_INT));g.dom=S.t+rnd(3.5,7);}
    if(S.t>=g.az){spawnAzione(scegliAzione());g.az=S.t+rnd(6,10);}
    if(S.t>=g.scan){if(inStato('lettura_ottica')<3)spawnScan();g.scan=S.t+rnd(6,11);}
  }
  if(c>=7*60+30&&c<23*60&&S.t>=g.cit){spawnPubblica(pick(Q_CIT),'sportello',{lang:'it'});g.cit=S.t+rnd(6,11)*(c>=20*60?1.7:1);}
  if(c>=8*60+20&&c<23*60&&S.t>=g.bus){spawnBus();g.bus=S.t+rnd(26,38);}
  if(c>=8*60&&c<22*60&&S.t>=g.auto){spawnAuto();g.auto=S.t+rnd(9,17);}
}
function step(dt){
  S.t+=dt;let c=clock();
  if(c>=23*60+30||c<7*60+30){S.offset+=((7*60+30-c)%1440+1440)%1440;c=clock();nuovoGiorno();}
  S.aperti=c>=8*60&&c<18*60;
  for(let i=S.timers.length-1;i>=0;i--)if(S.t>=S.timers[i].at){const f=S.timers[i].fn;S.timers.splice(i,1);f();}
  generatori();persone();
  for(const e of[...S.ents.values()]){let g=0;while(e.at!==null&&S.t>=e.at&&g++<6&&S.ents.has(e.id)){const fn=e.fn;e.at=null;e.fn=null;STEP[fn](e);}}

function renderFlow(c){const ol=$('#flow');
  if(!ol.children.length)ol.innerHTML=FASI.map(f=>'<li><button data-fase="'+f.id+'" data-tone="'+(f.tone||'')+'"><strong>0</strong><span>'+esc(f.nome)+'</span></button></li>').join('');

function chipOf(e){let g=KIND[e.kind].g,cls='t-'+e.tone;
  if(e.stato==='risposta_citata')g='citata';else if(e.tone==='mute')g='anello';else if(e.tone==='wait')g='doppio';else if(e.tone==='stop')g='stop';
  if(e.tone==='go'&&e.canale==='pubblico')cls='t-pub';return{g,cls};}
const rowEls=new Map();
function renderList(){
  const box=$('#rows'),q=S.query.trim().toLowerCase();let items=[];
  if(q){for(const id in P){const p=P[id];if((p.nome+' '+p.tech).toLowerCase().includes(q))items.push({key:'p:'+id,place:id});}
    for(const e of S.ents.values())if((e.id+' '+e.titolo+' '+(e.fonte||'')+' '+STATI[e.stato][0]).toLowerCase().includes(q))items.push({key:e.id,e});}
  else{for(const e of S.ents.values()){if(S.filter==='lavoro'?LAVORO.has(e.kind):S.filter==='attesa'?e.tone==='wait':e.canale==='pubblico')items.push({key:e.id,e});}}
  items.sort((a,b)=>(a.place?-1:0)-(b.place?-1:0)||((b.e?b.e.nato:0)-(a.e?a.e.nato:0))||(a.key<b.key?1:-1));items=items.slice(0,40);
  const keep=new Set(items.map(i=>i.key));for(const [k,el] of rowEls)if(!keep.has(k)){el.remove();rowEls.delete(k);}
  let empty=box.querySelector('.empty');
  if(!items.length){if(!empty){empty=document.createElement('p');empty.className='empty';box.appendChild(empty);}
    setText(empty,q?'Nessun luogo e nessuna richiesta con questo testo.':S.filter==='attesa'?'Niente aspetta una persona in questo momento.':'Nessuna cosa in scena con questo filtro.');return;}
  if(empty)empty.remove();
  let prev=null;
  for(const it of items){let el=rowEls.get(it.key);
    if(!el){el=document.createElement('button');el.className='row';el.dataset.key=it.key;el.innerHTML='<code></code><b></b><span class="chip"><span class="g"></span><span></span></span>';rowEls.set(it.key,el);}
    const code=el.children[0],b=el.children[1],g=el.children[2].children[0],st=el.children[2].children[1];
    if(it.place){const p=P[it.place];setText(code,'luogo');setText(b,p.nome);setText(st,p.tech);if(g.dataset.g!=='anello'){g.dataset.g='anello';g.className='g t-go';}}
    else{const e=it.e,c=chipOf(e);setText(code,e.id);setText(b,e.titolo);setText(st,STATI[e.stato][0]);if(g.dataset.g!==c.g)g.dataset.g=c.g;const cn='g '+c.cls;if(g.className!==cn)g.className=cn;}
    const cur=!!(S.sel&&((S.sel.t==='e'&&S.sel.id===it.key)||(S.sel.t==='p'&&'p:'+S.sel.id===it.key)));if((el.getAttribute('aria-current')==='true')!==cur)el.setAttribute('aria-current',cur?'true':'false');
    const want=prev?prev.nextSibling:box.firstChild;if(want!==el)box.insertBefore(el,want);prev=el;}
}

  let h='<div class="eyebrow">Legenda</div><h2>Come leggere il borgo</h2><p class="lead">Ogni luce \u00e8 un lavoro del Comune: va dove dicono i dati e cambia forma quando cambia stato.</p>'
   +'<div class="leg2"><ul class="legend">'+li('sfera','t-go','Domanda di un ufficio')+li('sfera','t-pub','Domanda del pubblico')+li('diamante','t-go','Azione di un agente')+li('foglio','t-go','Pagina d\u2019archivio')+li('cubo','t-go','Proposta in memoria')+'</ul>'
   +'<ul class="legend">'+li('citata','t-ok','Risposta con la fonte')+li('anello','t-mute','Astensione dichiarata')+li('doppio','t-wait','Aspetta una persona')+li('stop','t-stop','Bloccata da una regola')+'</ul></div>';
  if(arch)h+='<dl class="facts sub"><dt>T0</dt><dd>Lettura: automatico</dd><dt>T1</dt><dd>Bozza interna: a registro, dopo promozione oltre soglia</dd><dt>T2</dt><dd>Scrive su un sistema: una firma, con anteprima</dd><dt>T3</dt><dd>Effetti verso l\u2019esterno: due firme</dd><dt>Escluso</dt><dd>Blocco tecnico, nessuna esecuzione</dd></dl>'
    +'<p class="note">Canale pubblico, lingue oltre italiano e inglese e posti liberi in tempo reale sono proposti, non ancora a specifica.</p>';
  else h+='<p class="note">Clicca una luce o un edificio per aprirne la scheda.</p>';

function luogoFatti(id,c){const t=S.today,da=t.da[id]||0,or=S.aperti?'Aperto fino alle 18:00':'Chiuso, riapre alle 08:00',ev=evento();
  switch(id){
    case'segreteria':case'tributi':case'tecnico':return[['Domande di oggi',da],['Orario',or]];
    case'archivio':return[['Pagine lette oggi',t.pagine],['Sotto soglia oggi',t.sotto],['In lettura adesso',inStato('lettura_ottica')],['Soglia dimostrativa','80%']];
    case'steward':return[['In attesa adesso',c.stew],['Proposte approvate oggi',t.propOk],['Proposte rifiutate oggi',t.propNo],['Steward',S.aperti?'Presente':'Assente fino alle 08:00']];
    case'brain':return[['Atti in memoria',fmt(c.memoria)],['Entrati oggi',t.memoria],['In lavorazione adesso',inStato('nel_brain','prepara')],['Risposte con la fonte oggi',c.risposte],['Astensioni oggi',c.astensioni],['Accessi negati oggi',t.negati]];
    case'controllo':return[['In attesa di firma',c.attesa],['Approvate oggi',t.approvate],['Rifiutate oggi',t.rifiutate],['Escluse per regola',t.escluse],['Funzionario',S.aperti?'Presente':'Assente fino alle 08:00']];
    case'gestionali':return[['Azioni eseguite oggi',t.eseguite],['T1, a registro',t.T1],['T2, una firma',t.T2],['T3, due firme',t.T3]];
    case'varco':return[['Domande arrivate oggi',t.pubDomande],['Fermate oggi',t.fermate],['Dato ammesso','Solo «pubblico»'],['Scrittura','Nessuna: sola lettura']];
    case'sportello':return[['Domande di oggi',da],['Orario','A ogni ora']];
    case'infopoint':return[['Domande di oggi',da],['Lingue servite oggi',[...t.lingue].map(l=>LANG[l]).join(', ')||'nessuna'],['Visitatori in paese',c.visitatori]];
    case'museo':return[['Visitatori adesso',quanti(e=>e.dest==='museo'&&e.stato==='vis_visita')],['Orario','09:00-19:00']];
    case'eventi':return[['Evento',ev.nome],['Stato',ev.stato],['Orario',hhmm(ev.da)+'-'+hhmm(ev.a)],['Visitatori adesso',quanti(e=>e.dest==='eventi'&&e.stato==='vis_visita')]];
    case'parcheggio':return[['Posti',PARK.length],['Liberi adesso',c.liberi],['Auto in sosta',c.inSosta]];
    case'sentieri':return[['Stato',S.sentiero.stato==='chiuso'?'Chiuso':'Aperto'],['Atto',S.sentiero.atto||'Nessuna ordinanza in vigore'],['Visitatori al Castellaro',quanti(e=>e.dest==='sentieri'&&e.stato==='vis_visita')]];
    case'fermata':return[['Aspettano la corriera',inStato('vis_attesa')],['Arrivati oggi',t.arrivati]];}
  return[];}
function cosaFatti(e,arch,vivo){
  const f=[],L=LIV[e.livello]||null,k=e.kind;
  f.push(['Stato',vivo?STATI[e.stato][0]:STATI[e.stato][0]+'. Uscita dalla scena']);
  if(k==='domanda'){f.push(['Chiede',P[e.origine].nome]);
    if(!e.noto)f.push(['Esito','In elaborazione']);else if(e.esito==='citata')f.push(['Fonte citata',e.fonte]);else if(e.esito==='astensione')f.push(['Perché si astiene',e.motivo]);else f.push(['Perché è negato',e.motivo+'. Il contenuto non viene rivelato']);
    if(arch){f.push(['Livello',L.t]);f.push(['Controlli','Permessi alla query, poi citazione o astensione']);}}
  if(k==='azione'){f.push(['Preparata per',P[e.origine].nome]);f.push(['Livello',L.t]);f.push(['Regola',arch?L.a:L.s]);
    if(e.sistema)f.push(['Sistema',SYS[e.sistema].nome]);if(e.richieste)f.push(['Firme',e.firme+' di '+e.richieste]);if(e.motivo)f.push(['Motivo',e.motivo]);
    if(arch){f.push(['Chi classifica','Il control plane, non l’agente']);if(e.livello!=='escluso')f.push(['Passaggio','Gateway MCP con credenziali iniettate']);}}
  if(k==='scansione'){f.push(['Qualità di lettura',Math.round(e.qualita*100)+'%']);f.push(['Soglia dimostrativa','80%']);
    f.push(['Regola',arch?'Sotto soglia va allo steward e non entra in indice come testo affidabile':'Se è illeggibile decide lo steward']);}
  if(k==='proposta'){f.push(['Nasce da','Azione '+e.daAzione]);f.push(['Confidenza dichiarata',Math.round(e.confidenza*100)+'%']);f.push(['Decide','Lo steward']);
    if(arch)f.push(['Regola','Scrittura a scope di team: entra solo dopo approvazione, con fonte ed estratto']);}
  if(k==='pubblica'){f.push(['Chiede da',P[e.origine].nome]);f.push(['Lingua',LANG[e.lang]]);
    if(!e.noto)f.push(['Esito','In elaborazione']);else if(e.esito==='citata'){if(e.risposta)f.push(['Risposta',e.risposta]);f.push(['Fonte citata',e.fonte]);}
    else if(e.esito==='astensione')f.push(['Perché si astiene',e.motivo]);else f.push(['Perché si ferma',e.motivo]);
    f.push(['Dato ammesso','Solo «pubblico»']);if(arch)f.push(['Canale','Sola lettura, T0, nessuna memoria condivisa. Proposto, non ancora a specifica']);}
  if(k==='visitatore'){f.push(['Lingua',LANG[e.lang]]);f.push(['Ha chiesto',Q_VIS[e.tema].q]);if(e.esitoDomanda)f.push(['Ha saputo',e.esitoDomanda]);if(e.dest)f.push(['Va verso',P[e.dest].nome]);f.push(['Identità','Anonimo: nessun profilo, nessuna memoria']);}
  if(k==='auto')f.push(['Posto',(e.slot===null?'':e.slot+1)]);
  if(k==='corriera')f.push(['Visitatori portati',e.bordo]);
  return f;}
function scheda(){
  const c=conta(),arch=S.view==='architettura',sel=S.sel;
  if(!sel)return legenda();
  const dl=f=>'<dl class="facts">'+f.map((r,i)=>'<dt>'+esc(r[0])+'</dt><dd data-k="f'+i+'"></dd>').join('')+'</dl>';
  const vals=f=>{const o={};f.forEach((r,i)=>o['f'+i]=String(r[1]));return o;};
  if(sel.t==='p'){const p=P[sel.id],f=luogoFatti(sel.id,c);
    return{key:'p'+sel.id+S.view+f.map(r=>r[0]).join('|'),vals:vals(f),
      html:'<div class="eyebrow">'+(p.canale==='pubblico'?'Canale pubblico':'Canale interno')+(p.proposto?' <span class="prop">proposto</span>':'')+'</div><h2>'+esc(p.nome)+'</h2><p class="lead">'+esc(arch?p.a:p.s)+'</p>'+dl(f)
        +'<div class="acts"><button class="btn" data-act="inquadra">Inquadra</button><button class="btn" data-act="chiudi">Chiudi</button></div>'};}
  const vivo=sel.t==='e',e=vivo?S.ents.get(sel.id):sel.snap;if(!e)return legenda();
  const f=cosaFatti(e,arch,vivo),firma1=vivo&&e.coda==='ctrl'&&!e.motion,c2=chipOf(e);
  const lab=e.richieste===2?(e.firme===0?'Prima firma':'Seconda firma'):'Approva';
  return{key:'e'+e.id+S.view+(vivo?1:0)+(firma1?lab+e.firme:'')+f.map(r=>r[0]).join('|')+c2.g+c2.cls+(S.follow?1:0),vals:vals(f),
    html:'<div class="eyebrow">'+esc(KIND[e.kind].nome)+(e.kind==='pubblica'?' <span class="prop">proposto</span>':'')+'</div><h2>'+esc(e.titolo)+'</h2>'
      +'<p class="lead chip" style="display:flex">'+G(c2.g,c2.cls)+'<span>'+esc(e.id)+'</span></p>'+dl(f)
      +'<div class="acts">'+(firma1?'<button class="btn go" data-act="firma">'+lab+'</button>'+(e.firme===0?'<button class="btn no" data-act="rifiuta">Rifiuta</button>':''):'')
      +(vivo?'<button class="btn" data-act="segui" aria-pressed="'+(S.follow?'true':'false')+'">Segui</button>':'')+'<button class="btn" data-act="chiudi">Chiudi</button></div>'
      +(firma1&&e.manuale?'<p class="note">Questa azione aspetta te: in questa demo il funzionario sei tu.</p>':'')};
}

  else if(a==='firma'&&e){firma(e,'tu');emit('firma');}else if(a==='rifiuta'&&e){rifiuta(e);emit('firma');}});
document.addEventListener('keyup',ev=>{if(ev.key===' '&&!ev.target.matches('input,textarea'))ev.preventDefault();});
document.addEventListener('keydown',ev=>{if(ev.target.matches('input,textarea'))return;if(ev.metaKey||ev.ctrlKey||ev.altKey)return;const k=ev.key;
  if(k===' '){ev.preventDefault();pausa();}else if(k==='Escape')seleziona(null);
  else if(k==='1')velocita(1);else if(k==='2')velocita(2);else if(k==='4')velocita(4);
  else if(k==='q'||k==='Q')ruota(-1);else if(k==='e'||k==='E')ruota(1);else if(k==='0')home();
  else if(k==='+'||k==='='){cam.g.zoom*=1.2;W.dirty=true;}else if(k==='-'){cam.g.zoom/=1.2;W.dirty=true;}
  else if(k.startsWith('Arrow')){if(window.innerWidth<=980||ev.target.closest('.rows,.detail'))return;ev.preventDefault();const s=40;pan(k==='ArrowLeft'?s:k==='ArrowRight'?-s:0,k==='ArrowUp'?s:k==='ArrowDown'?-s:0);cam.g.tx=cam.tx;cam.g.tz=cam.tz;}});

function bindCanvas(){
  const cv=W.canvas,ptr=new Map();let moved=0,pinch=0,hoverRaf=0,hx=0,hy=0;
  const xy=ev=>{const r=cv.getBoundingClientRect();return{x:ev.clientX-r.left,y:ev.clientY-r.top};};
  cv.addEventListener('pointerdown',ev=>{cv.setPointerCapture(ev.pointerId);ptr.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});moved=ptr.size>1?99:0;
    if(ptr.size===2){const a=[...ptr.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}});
  cv.addEventListener('pointermove',ev=>{const p=ptr.get(ev.pointerId);
    if(p){const dx=ev.clientX-p.x,dy=ev.clientY-p.y;p.x=ev.clientX;p.y=ev.clientY;
      if(ptr.size===1){moved+=Math.abs(dx)+Math.abs(dy);if(moved>5){pan(dx,dy);cv.classList.add('is-drag');}}
      else if(ptr.size===2){const a=[...ptr.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch>0){cam.g.zoom*=d/pinch;cam.zoom=cam.g.zoom;}pinch=d;W.dirty=true;}
      return;}
    const q=xy(ev);hx=q.x;hy=q.y;if(!hoverRaf)hoverRaf=requestAnimationFrame(()=>{hoverRaf=0;const h=pickAt(hx,hy),was=S.hover;
      if((h&&h.t)!==(was&&was.t)||(h&&h.id)!==(was&&was.id)){S.hover=h;cv.classList.toggle('is-hit',!!h);W.dirty=true;}});});
  const up=ev=>{if(!ptr.has(ev.pointerId))return;const solo=ptr.size===1;ptr.delete(ev.pointerId);cv.classList.remove('is-drag');
    if(solo&&moved<=5&&ev.type==='pointerup'){const q=xy(ev);seleziona(pickAt(q.x,q.y));}pinch=0;};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('pointerleave',()=>{if(S.hover){S.hover=null;cv.classList.remove('is-hit');W.dirty=true;}});
  cv.addEventListener('wheel',ev=>{ev.preventDefault();cam.g.zoom*=Math.exp(-ev.deltaY*0.0016);W.dirty=true;},{passive:false});
  if(window.ResizeObserver)new ResizeObserver(resize).observe(W.stage);else window.addEventListener('resize',resize);
}

/* ================= 8. AVVIO E CICLO ================= */
if(initScene())bindCanvas();
else{const n=document.createElement('div');n.className='nogl';n.innerHTML='<p>La scena 3D non parte su questo dispositivo. Numeri, copione ed elenchi funzionano lo stesso, perché leggono gli stessi dati.</p>';$('#stage').appendChild(n);$('#c').hidden=true;$('.viewctl').hidden=true;}
renderAll();
let last=performance.now(),acc=0,lastEmit=0;
function frame(now){
  const dt=Math.min(0.25,(now-last)/1000);last=now;
  if(!S.paused){acc+=dt*S.speed;let n=0;while(acc>=STEP_DT&&n<24){step(STEP_DT);acc-=STEP_DT;n++;}if(n===24)acc=0;}
  if(now-lastEmit>240){lastEmit=now;emit('tick');}
  if(W.ok)renderFrame(S.t+acc,dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if(location.hash==='#test')window.__borgo={S,W,cam,conta,pickAt,momento,seleziona,pausa,velocita,vista,saltaA,firma,avanza(m){avanza(m);emit('test');if(W.ok){W.dirty=true;}},get acc(){return acc;},
  disegna(){if(W.ok){applyCam(1);drawEntities(S.t);drawOverlay();W.renderer.render(W.scene,W.camera);}}};

})();
